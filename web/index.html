<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Rodas Friend Zone Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#cfeff7;
    color:#532477;
}

button{
    font-family:inherit;
    border:0;
}

.hidden{
    display:none!important;
}


/* =====================================================
   SELECTION
===================================================== */

#selectionView{
    min-height:100vh;
    background:#cfa7f2;
}

.selection-top{
    background:#982fe5;
    padding:12px;
    color:white;
}

.selection-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.selection-pill{
    background:#fff6fb;
    color:#592579;
    border-radius:25px;
    padding:10px 4px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
}

.selection-pill strong{
    display:block;
    font-size:20px;
    margin-top:2px;
}

.selection-timer{
    text-align:center;
    margin-top:13px;
    color:#2de1ed;
    font-size:22px;
    font-weight:bold;
}

.selection-body{
    padding:12px;
}

.selection-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
}

.cartela-grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:5px;
}

.cartela{
    height:38px;
    background:#eddafb;
    color:#633489;
    border-radius:5px;
    font-size:15px;
    font-weight:bold;
}

.cartela.taken{
    background:#e32b32;
    color:white;
}

.cartela.selected{
    background:#13a84b;
    color:white;
    box-shadow:0 0 0 2px #65ed91;
}

.selection-buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.refresh-btn,
.proceed-btn{
    border-radius:30px;
    padding:13px;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.refresh-btn{
    flex:1;
    background:#9835df;
}

.proceed-btn{
    flex:1.5;
    background:#ff650b;
}

.proceed-btn:disabled{
    opacity:.45;
}

.selection-footer{
    text-align:center;
    padding:45px 0 20px;
    font-size:18px;
}


/* =====================================================
   GAME
===================================================== */

#gameView{
    min-height:100vh;
    background:#cfeff7;
    padding:8px;
}

.game-info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
}

.info-box{
    background:#fffdf3;
    border-radius:14px;
    padding:7px 2px;
    text-align:center;
}

.info-label{
    font-size:12px;
    color:#6d327c;
    font-weight:bold;
}

.info-value{
    font-size:18px;
    color:#171717;
    font-weight:bold;
    margin-top:2px;
}

.game-countdown{
    text-align:center;
    color:#22c9d7;
    font-size:19px;
    font-weight:bold;
    padding:7px 0;
}

.game-layout{
    display:grid;
    grid-template-columns:42% 58%;
    gap:6px;
}

.call-board{
    background:#dff7fc;
    border-radius:8px;
    padding:3px;
}

.call-head{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    margin-bottom:3px;
}

.call-letter{
    color:white;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    padding:5px 0;
    border-radius:5px;
}

.B{background:#149b38;}
.I{background:#ee8a1d;}
.N{background:#273ed2;}
.G{background:#e6252b;}
.O{background:#7d187c;}

.call-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
}

.call-number{
    background:#f5eaff;
    color:#663784;
    border-radius:3px;
    text-align:center;
    padding:4px 0;
    font-size:12px;
    font-weight:bold;
}

.call-number.called{
    background:#4cc76b;
    color:white;
}

.call-number.current{
    box-shadow:0 0 0 2px #ff7800;
}

.right-side{
    min-width:0;
}

.current-call{
    background:#97008f;
    border-radius:38px;
    min-height:72px;
    padding:7px 9px 7px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.current-ball{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#ff9200;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
}

.recent-box{
    background:white;
    border-radius:13px;
    min-height:57px;
    margin-top:6px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:6px;
}

.recent-ball{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#2941d5;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.auto-box{
    background:white;
    border-radius:13px;
    margin-top:6px;
    padding:8px 10px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    font-size:16px;
    font-weight:bold;
}

.auto-switch{
    width:53px;
    height:29px;
    border-radius:20px;
    background:#4cc96c;
    padding:3px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
}

.auto-switch.off{
    background:#999;
    justify-content:flex-start;
}

.auto-dot{
    width:23px;
    height:23px;
    background:white;
    border-radius:50%;
}

.card-title{
    background:#fff;
    margin-top:6px;
    padding:5px;
    border-radius:11px 11px 0 0;
    text-align:center;
    font-size:12px;
    font-weight:bold;
    color:#63808b;
}

.player-card-wrap{
    background:white;
    padding:5px;
    border-radius:0 0 11px 11px;
}

.player-card{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.player-card th{
    color:white;
    font-size:13px;
    padding:5px 0;
}

.player-card th:nth-child(1){background:#294889;}
.player-card th:nth-child(2){background:#df252b;}
.player-card th:nth-child(3){background:#16a354;}
.player-card th:nth-child(4){background:#d68c00;}
.player-card th:nth-child(5){background:#dc2229;}

.player-card td{
    height:38px;
    border:1px solid #ddd;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    color:#222;
    background:white;
}

.player-card td.free{
    background:#4ed98c;
    color:#137c49;
}

.player-card td.marked{
    background:#4fc977;
    color:white;
}

.card-number{
    background:white;
    text-align:center;
    padding:5px;
    font-size:13px;
    font-weight:bold;
    color:#65818d;
}

.bingo-btn{
    width:100%;
    margin-top:6px;
    background:#ff7011;
    color:white;
    border-radius:25px;
    padding:10px;
    font-size:19px;
    font-weight:bold;
}

.bingo-btn:disabled{
    opacity:.5;
}

.game-buttons{
    display:flex;
    gap:6px;
    margin-top:6px;
}

.leave-btn,
.game-refresh-btn{
    flex:1;
    border-radius:25px;
    padding:9px;
    color:white;
    font-size:14px;
    font-weight:bold;
}

.leave-btn{background:#e52d32;}
.game-refresh-btn{background:#2866e7;}


/* =====================================================
   RESULT
===================================================== */

#resultView{
    min-height:100vh;
    background:#cfeff7;
    padding:12px;
}

.result-card{
    background:white;
    border-radius:22px;
    padding:20px 14px;
    text-align:center;
    box-shadow:0 3px 10px #0002;
}

.result-title{
    font-size:30px;
    font-weight:bold;
    color:#18a64b;
}

.result-loser{
    color:#e22c32;
}

.result-subtitle{
    margin-top:8px;
    font-size:21px;
    font-weight:bold;
    color:#65267f;
}

.result-line{
    margin-top:8px;
    font-size:17px;
    color:#333;
}

.result-prize{
    margin-top:15px;
    font-size:27px;
    font-weight:bold;
    color:#ff710c;
}

.result-number{
    margin:15px auto;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#ff9200;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:21px;
    font-weight:bold;
}

.result-countdown{
    margin-top:15px;
    color:#1bbaca;
    font-size:18px;
    font-weight:bold;
}

.wrong-overlay{
    position:fixed;
    inset:0;
    background:#0008;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:99;
}

.wrong-card{
    background:white;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
    width:100%;
    max-width:350px;
}

.wrong-card h1{
    color:#e32c32;
    font-size:29px;
}

.wrong-card p{
    font-size:19px;
    font-weight:bold;
    color:#555;
}

@media(max-width:600px){

    .call-number{
        font-size:11px;
        padding:4px 0;
    }

    .call-letter{
        font-size:16px;
    }

    .current-call{
        font-size:15px;
    }

    .current-ball{
        width:53px;
        height:53px;
        font-size:16px;
    }

    .player-card td{
        height:35px;
        font-size:13px;
    }

}

</style>

</head>

<body>


<!-- =====================================================
     SELECTION
===================================================== -->

<section id="selectionView">

    <div class="selection-top">

        <div class="selection-info">

            <div class="selection-pill">
                Wallet
                <strong id="selectionWallet">0</strong>
            </div>

            <div class="selection-pill">
                Players
                <strong id="selectionPlayers">0</strong>
            </div>

            <div class="selection-pill">
                Bet
                <strong>10</strong>
            </div>

        </div>

        <div class="selection-timer">
            Starting game in
            <span id="selectionTimer">30</span>
            sec
        </div>

    </div>

    <div class="selection-body">

        <div class="selection-title">
            Choose Your Cartela
        </div>

        <div id="cartelaGrid" class="cartela-grid"></div>

        <div class="selection-buttons">

            <button
                id="selectionRefresh"
                class="refresh-btn"
                onclick="refreshSelection()">
                Refresh
            </button>

            <button
                id="proceedButton"
                class="proceed-btn"
                onclick="proceedToGame()"
                disabled>
                Proceed
            </button>

        </div>

        <div class="selection-footer">
            Rodas Friend Zone
        </div>

    </div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section id="gameView" class="hidden">

    <div class="game-info">

        <div class="info-box">
            <div class="info-label">Players</div>
            <div id="playersValue" class="info-value">0</div>
        </div>

        <div class="info-box">
            <div class="info-label">Derash</div>
            <div id="derashValue" class="info-value">0</div>
        </div>

        <div class="info-box">
            <div class="info-label">Bet</div>
            <div class="info-value">10</div>
        </div>

        <div class="info-box">
            <div class="info-label">Call</div>
            <div id="callCountValue" class="info-value">0</div>
        </div>

    </div>

    <div id="gameCountdown" class="game-countdown">

        Game starting in
        <span id="gameTimer">30</span>
        sec

    </div>

    <div class="game-layout">

        <div class="call-board">

            <div class="call-head">

                <div class="call-letter B">B</div>
                <div class="call-letter I">I</div>
                <div class="call-letter N">N</div>
                <div class="call-letter G">G</div>
                <div class="call-letter O">O</div>

            </div>

            <div id="callGrid" class="call-grid"></div>

        </div>

        <div class="right-side">

            <div class="current-call">

                <span>Current Call</span>

                <div id="currentBall" class="current-ball">
                    —
                </div>

            </div>

            <div id="recentCalls" class="recent-box"></div>

            <div class="auto-box">

                <span>Auto</span>

                <div
                    id="autoSwitch"
                    class="auto-switch"
                    onclick="toggleAuto()">

                    <div class="auto-dot"></div>

                </div>

            </div>

            <div class="card-title">
                CHOSEN CARTELA
                <span id="chosenCartela">—</span>
            </div>

            <div class="player-card-wrap">

                <table class="player-card">

                    <thead>
                        <tr>
                            <th>B</th>
                            <th>I</th>
                            <th>N</th>
                            <th>G</th>
                            <th>O</th>
                        </tr>
                    </thead>

                    <tbody id="playerCard"></tbody>

                </table>

            </div>

            <div id="cardNumber" class="card-number">
                Card Number: —
            </div>

            <button
                id="bingoButton"
                class="bingo-btn"
                onclick="claimBingo()"
                disabled>
                BINGO WIN
            </button>

            <div class="game-buttons">

                <button
                    class="leave-btn"
                    onclick="leaveGame()">
                    Leave
                </button>

                <button
                    class="game-refresh-btn"
                    onclick="refreshGame()">
                    Refresh
                </button>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section id="resultView" class="hidden">

    <div class="result-card">

        <div id="resultTitle" class="result-title">
            🏆 WINNER
        </div>

        <div id="resultSubtitle" class="result-subtitle"></div>

        <div id="resultDetails" class="result-line"></div>

        <div id="resultPrize" class="result-prize"></div>

        <div id="resultNumber" class="result-number">
            —
        </div>

        <div id="resultCountdown" class="result-countdown">
            Next game in 10 sec
        </div>

    </div>

</section>


<!-- =====================================================
     WRONG CARTELA
===================================================== -->

<div id="wrongOverlay" class="wrong-overlay hidden">

    <div class="wrong-card">

        <h1>❌ WRONG CARTELA</h1>

        <p>You lose.</p>

        <p>Better luck next time!</p>

    </div>

</div>


<script>


/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram?.WebApp;

if(tg){

    tg.ready();
    tg.expand();

}


/* =====================================================
   USER ID
===================================================== */

function getUserId(){

    if(
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.id
    ){

        return String(
            tg.initDataUnsafe.user.id
        );

    }

    let id =
        localStorage.getItem(
            "rfz_user_id"
        );

    if(!id){

        id =
            "web-" +
            Math.random()
                .toString(36)
                .substring(2) +
            Date.now();

        localStorage.setItem(
            "rfz_user_id",
            id
        );

    }

    return id;

}

const USER_ID = getUserId();


/* =====================================================
   STATE
===================================================== */

let state = null;

let selectedCartela = null;

let proceeded = false;

let currentGame = null;

let autoMode =
    localStorage.getItem("rfz_auto") !== "off";

let manualMarks = new Set();

let claimInProgress = false;

let autoClaimInProgress = false;


/* =====================================================
   API
===================================================== */

async function api(url, options = {}){

    const headers = {
        ...(options.headers || {}),
        "X-User-ID": USER_ID,
        "Cache-Control": "no-cache"
    };

    const separator =
        url.includes("?")
        ? "&"
        : "?";

    const response =
        await fetch(
            url +
            separator +
            "_=" +
            Date.now(),
            {
                ...options,
                headers
            }
        );

    let data = {};

    try{

        data = await response.json();

    }catch{

        data = {};

    }

    if(!response.ok){

        const error =
            new Error(
                data.error ||
                data.message ||
                "Server error"
            );

        error.data = data;

        throw error;

    }

    return data;

}


/* =====================================================
   LOAD STATE
===================================================== */

async function loadState(){

    try{

        const newState =
            await api("/api/state");

        const oldGame =
            currentGame;

        const newGame =
            newState.game;

        /*
         * Only reset the local player state
         * when a genuinely NEW game starts.
         */

        if(
            oldGame !== null &&
            newGame !== oldGame
        ){

            proceeded = false;

            selectedCartela = null;

            manualMarks.clear();

        }

        currentGame = newGame;

        state = newState;


        /*
         * Restore Cartela selected on server.
         */

        if(
            newState.selected ||
            newState.my_cartela ||
            newState.cartela
        ){

            selectedCartela =
                Number(
                    newState.selected ||
                    newState.my_cartela ||
                    newState.cartela
                );

        }


        /*
         * If server says this user proceeded,
         * keep them inside the game screen.
         */

        if(newState.proceeded){

            proceeded = true;

        }


        /*
         * If server is still in selection and
         * user has not proceeded, selection page.
         */

        if(
            newState.phase === "selection" &&
            !newState.proceeded &&
            !proceeded
        ){

            if(!newState.selected){

                selectedCartela = null;

            }

        }


        render();

    }catch(error){

        console.log(
            "State error:",
            error.message
        );

    }

}


/* =====================================================
   VIEW
===================================================== */

function showView(id){

    document
        .getElementById("selectionView")
        .classList.add("hidden");

    document
        .getElementById("gameView")
        .classList.add("hidden");

    document
        .getElementById("resultView")
        .classList.add("hidden");

    document
        .getElementById(id)
        .classList.remove("hidden");

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    if(!state)
        return;


    /*
     * FINISHED
     */

    if(state.phase === "finished"){

        showView("resultView");

        renderResult();

        return;

    }


    /*
     * PLAYING
     */

    if(state.phase === "playing"){

        showView("gameView");

        renderGame();

        return;

    }


    /*
     * STARTING
     *
     * THIS IS THE IMPORTANT FIX.
     *
     * The old code did not handle "starting",
     * so it returned to Cartela selection.
     */

    if(state.phase === "starting"){

        showView("gameView");

        renderGame();

        return;

    }


    /*
     * SELECTION AFTER PROCEED
     *
     * While the server is still in selection,
     * the player who pressed Proceed stays
     * inside the game screen.
     */

    if(
        state.phase === "selection" &&
        proceeded &&
        selectedCartela
    ){

        showView("gameView");

        renderGame();

        return;

    }


    /*
     * NORMAL CARTELA SELECTION
     */

    showView("selectionView");

    renderSelection();

}


/* =====================================================
   SELECTION
===================================================== */

function renderSelection(){

    document
        .getElementById("selectionWallet")
        .textContent =
        state.wallet ?? 0;

    document
        .getElementById("selectionPlayers")
        .textContent =
        state.players ?? 0;

    document
        .getElementById("selectionTimer")
        .textContent =
        Math.max(
            0,
            Number(
                state.selection_remaining ?? 0
            )
        );

    renderCartelas();

    document
        .getElementById("proceedButton")
        .disabled =
        !selectedCartela;

}


/* =====================================================
   CARTELA GRID
===================================================== */

function renderCartelas(){

    const grid =
        document.getElementById(
            "cartelaGrid"
        );

    grid.innerHTML = "";

    const taken =
        state.taken_cartelas ||
        state.taken ||
        [];

    for(
        let number = 1;
        number <= 100;
        number++
    ){

        const button =
            document.createElement("button");

        button.className = "cartela";

        button.textContent = number;

        if(
            taken.includes(number) &&
            Number(selectedCartela) !== number
        ){

            button.classList.add("taken");

        }

        if(
            Number(selectedCartela) === number
        ){

            button.classList.add("selected");

        }

        button.onclick =
            () => selectCartela(number);

        grid.appendChild(button);

    }

}


/* =====================================================
   SELECT CARTELA
===================================================== */

async function selectCartela(number){

    if(!state)
        return;

    if(
        Number(
            state.selection_remaining ?? 0
        ) <= 0
    ){

        alert(
            "Cartela selection time has ended."
        );

        return;

    }


    try{

        const result =
            await api(
                "/api/select",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        cartela:number
                    })

                }
            );


        if(result.success){

            selectedCartela = number;

            await loadState();

        }else{

            alert(
                result.message ||
                "Could not select Cartela."
            );

        }

    }catch(error){

        alert(
            error.message
        );

    }

}


/* =====================================================
   PROCEED
===================================================== */

async function proceedToGame(){

    if(!selectedCartela){

        alert(
            "Please choose a Cartela first."
        );

        return;

    }


    const button =
        document.getElementById(
            "proceedButton"
        );

    button.disabled = true;

    button.textContent =
        "Entering...";


    try{

        /*
         * IMPORTANT:
         *
         * The old version only changed
         * "proceeded" locally.
         *
         * This version actually tells
         * the Python server that the player
         * pressed PROCEED.
         */

        const result =
            await api(
                "/api/proceed",
                {
                    method:"POST"
                }
            );


        if(!result.success){

            alert(
                result.message ||
                "Could not enter the game."
            );

            return;

        }


        proceeded = true;

        selectedCartela =
            Number(
                result.selected ||
                result.my_cartela ||
                result.cartela ||
                selectedCartela
            );

        state = result;

        /*
         * Immediately show the game screen.
         */

        showView("gameView");

        renderGame();


    }catch(error){

        alert(
            error.message ||
            "Could not enter the game."
        );

    }finally{

        button.disabled =
            !selectedCartela;

        button.textContent =
            "Proceed";

    }

}


/* =====================================================
   REFRESH SELECTION
===================================================== */

async function refreshSelection(){

    const button =
        document.getElementById(
            "selectionRefresh"
        );

    button.disabled = true;

    button.textContent =
        "Refreshing...";

    try{

        await loadState();

    }finally{

        button.disabled = false;

        button.textContent =
            "Refresh";

    }

}


/* =====================================================
   GAME
===================================================== */

function renderGame(){

    document
        .getElementById("playersValue")
        .textContent =
        state.players ?? 0;

    document
        .getElementById("derashValue")
        .textContent =
        state.prize ?? 0;

    const called =
        state.called ||
        state.drawn_numbers ||
        [];

    document
        .getElementById("callCountValue")
        .textContent =
        called.length;


    /*
     * STARTING COUNTDOWN
     *
     * During "starting" use
     * start_remaining.
     */

    const countdown =
        document.getElementById(
            "gameCountdown"
        );

    const timer =
        document.getElementById(
            "gameTimer"
        );


    if(
        state.phase === "starting"
    ){

        countdown.classList.remove(
            "hidden"
        );

        countdown.innerHTML =
            "Game starting in <span id=\"gameTimer\">" +
            Math.max(
                0,
                Number(
                    state.start_remaining ?? 0
                )
            ) +
            "</span> sec";

    }

    /*
     * During selection after Proceed,
     * keep showing the selection countdown.
     */

    else if(
        state.phase === "selection"
    ){

        countdown.classList.remove(
            "hidden"
        );

        countdown.innerHTML =
            "Game starting in <span id=\"gameTimer\">" +
            Math.max(
                0,
                Number(
                    state.selection_remaining ?? 0
                )
            ) +
            "</span> sec";

    }

    else{

        countdown.classList.add(
            "hidden"
        );

    }


    renderCallBoard();

    renderCurrentCall();

    renderRecentCalls();

    renderAuto();

    renderPlayerCard();


    document
        .getElementById("chosenCartela")
        .textContent =
        selectedCartela || "—";


    document
        .getElementById("cardNumber")
        .textContent =
        "Card Number: " +
        (
            selectedCartela ||
            "—"
        );


    const bingoButton =
        document.getElementById(
            "bingoButton"
        );

    bingoButton.disabled =
        state.phase !== "playing" ||
        state.blocked ||
        !!state.winner;

}


/* =====================================================
   1-75 BOARD
===================================================== */

function bingoLetter(number){

    if(number <= 15)
        return "B";

    if(number <= 30)
        return "I";

    if(number <= 45)
        return "N";

    if(number <= 60)
        return "G";

    return "O";

}


function renderCallBoard(){

    const grid =
        document.getElementById(
            "callGrid"
        );

    grid.innerHTML = "";

    const called =
        state.called ||
        state.drawn_numbers ||
        [];

    const current =
        state.current ??
        state.current_number;

    for(
        let row = 1;
        row <= 15;
        row++
    ){

        for(
            let column = 0;
            column < 5;
            column++
        ){

            const number =
                row +
                column * 15;

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "call-number";

            if(
                called.includes(number)
            ){

                cell.classList.add(
                    "called"
                );

            }

            if(
                Number(current) === number
            ){

                cell.classList.add(
                    "current"
                );

            }

            cell.textContent =
                number;

            grid.appendChild(cell);

        }

    }

}


/* =====================================================
   CURRENT CALL
===================================================== */

function renderCurrentCall(){

    const current =
        state.current ??
        state.current_number;

    const ball =
        document.getElementById(
            "currentBall"
        );

    if(!current){

        ball.textContent = "—";

        return;

    }

    ball.textContent =
        bingoLetter(current) +
        "-" +
        current;

}


/* =====================================================
   RECENT CALLS
===================================================== */

function renderRecentCalls(){

    const box =
        document.getElementById(
            "recentCalls"
        );

    const called =
        state.called ||
        state.drawn_numbers ||
        [];

    const recent =
        called
            .slice(-3)
            .reverse();

    box.innerHTML = "";

    if(!recent.length){

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "recent-ball";

        empty.textContent = "—";

        box.appendChild(empty);

        return;

    }

    recent.forEach(number => {

        const ball =
            document.createElement(
                "div"
            );

        ball.className =
            "recent-ball";

        ball.textContent =
            bingoLetter(number) +
            "-" +
            number;

        box.appendChild(ball);

    });

}


/* =====================================================
   AUTO
===================================================== */

function renderAuto(){

    const sw =
        document.getElementById(
            "autoSwitch"
        );

    if(autoMode){

        sw.classList.remove("off");

    }else{

        sw.classList.add("off");

    }

}


function toggleAuto(){

    autoMode = !autoMode;

    localStorage.setItem(
        "rfz_auto",
        autoMode ? "on" : "off"
    );

    render();

    if(autoMode){

        checkAutoBingo();

    }

}


/* =====================================================
   PLAYER CARD
===================================================== */

function renderPlayerCard(){

    const tbody =
        document.getElementById(
            "playerCard"
        );

    tbody.innerHTML = "";

    const card = state.card;

    if(!card){

        tbody.innerHTML = `
            <tr>
                <td colspan="5"
                    style="height:130px;color:#888;">
                    Waiting for Cartela...
                </td>
            </tr>
        `;

        return;

    }


    const called =
        new Set(
            state.called ||
            state.drawn_numbers ||
            []
        );


    for(
        let row = 0;
        row < 5;
        row++
    ){

        const tr =
            document.createElement("tr");


        for(
            let column = 0;
            column < 5;
            column++
        ){

            const td =
                document.createElement("td");

            const value =
                card[row][column];


            if(
                row === 2 &&
                column === 2
            ){

                td.textContent = "FREE";

                td.classList.add("free");

            }else{

                td.textContent = value;

                const number =
                    Number(value);


                if(
                    autoMode &&
                    called.has(number)
                ){

                    td.classList.add(
                        "marked"
                    );

                }


                if(
                    !autoMode &&
                    manualMarks.has(number)
                ){

                    td.classList.add(
                        "marked"
                    );

                }


                td.onclick =
                    () => manualMark(
                        number,
                        td
                    );

            }

            tr.appendChild(td);

        }

        tbody.appendChild(tr);

    }


    if(
        autoMode &&
        state.phase === "playing" &&
        !state.blocked &&
        !state.winner
    ){

        checkAutoBingo();

    }

}


/* =====================================================
   MANUAL MARK
===================================================== */

function manualMark(number, cell){

    if(autoMode)
        return;

    if(state.phase !== "playing")
        return;

    if(state.blocked)
        return;

    const called =
        new Set(
            state.called ||
            state.drawn_numbers ||
            []
        );

    if(!called.has(number))
        return;


    if(manualMarks.has(number)){

        manualMarks.delete(number);

        cell.classList.remove(
            "marked"
        );

    }else{

        manualMarks.add(number);

        cell.classList.add(
            "marked"
        );

    }

}


/* =====================================================
   LOCAL BINGO CHECK
===================================================== */

function localHasBingo(card, called){

    const isCalled =
        value =>
            value === 0 ||
            value === "FREE" ||
            called.has(Number(value));


    for(
        let row = 0;
        row < 5;
        row++
    ){

        if(
            card[row].every(isCalled)
        ){

            return true;

        }

    }


    for(
        let column = 0;
        column < 5;
        column++
    ){

        let win = true;

        for(
            let row = 0;
            row < 5;
            row++
        ){

            if(
                !isCalled(
                    card[row][column]
                )
            ){

                win = false;

                break;

            }

        }

        if(win)
            return true;

    }


    let diagonal = true;

    for(
        let i = 0;
        i < 5;
        i++
    ){

        if(
            !isCalled(
                card[i][i]
            )
        ){

            diagonal = false;

            break;

        }

    }

    if(diagonal)
        return true;


    diagonal = true;

    for(
        let i = 0;
        i < 5;
        i++
    ){

        if(
            !isCalled(
                card[i][4-i]
            )
        ){

            diagonal = false;

            break;

        }

    }

    return diagonal;

}


/* =====================================================
   AUTO BINGO
===================================================== */

async function checkAutoBingo(){

    if(autoClaimInProgress)
        return;

    if(
        !state ||
        state.phase !== "playing" ||
        state.blocked ||
        state.winner ||
        !state.card
    )
        return;


    const called =
        new Set(
            state.called ||
            state.drawn_numbers ||
            []
        );


    if(
        !localHasBingo(
            state.card,
            called
        )
    ){

        return;

    }


    autoClaimInProgress = true;


    try{

        const result =
            await api(
                "/api/claim-bingo",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        marked:
                            Array.from(called)
                    })

                }
            );


        if(result.winner){

            await loadState();

        }


    }catch(error){

        showWrongCartela();

        await loadState();

    }finally{

        setTimeout(
            () => {

                autoClaimInProgress =
                    false;

            },
            500
        );

    }

}


/* =====================================================
   BINGO BUTTON
===================================================== */

async function claimBingo(){

    if(claimInProgress)
        return;

    if(
        !state ||
        state.phase !== "playing"
    )
        return;

    if(state.blocked)
        return;


    claimInProgress = true;


    try{

        let marked;


        if(autoMode){

            marked =
                state.called ||
                state.drawn_numbers ||
                [];

        }else{

            marked =
                Array.from(
                    manualMarks
                );

        }


        const result =
            await api(
                "/api/claim-bingo",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        marked:marked
                    })

                }
            );


        if(result.winner){

            await loadState();

            return;

        }


        if(result.wrong){

            showWrongCartela();

            await loadState();

        }else{

            alert(
                result.message ||
                "Bingo claim failed."
            );

        }


    }catch(error){

        alert(
            error.message ||
            "Bingo claim failed."
        );

    }finally{

        claimInProgress = false;

    }

}


/* =====================================================
   WRONG CARTELA
===================================================== */

function showWrongCartela(){

    document
        .getElementById("wrongOverlay")
        .classList.remove("hidden");

    setTimeout(
        () => {

            document
                .getElementById("wrongOverlay")
                .classList.add("hidden");

        },
        3500
    );

}


/* =====================================================
   GAME REFRESH
===================================================== */

async function refreshGame(){

    await loadState();

}


/* =====================================================
   LEAVE
===================================================== */

async function leaveGame(){

    try{

        const result =
            await api(
                "/api/leave",
                {
                    method:"POST"
                }
            );


        if(!result.success){

            alert(
                result.message ||
                "Could not leave the game."
            );

            return;

        }


        selectedCartela = null;

        proceeded = false;

        manualMarks.clear();

        await loadState();


    }catch(error){

        alert(
            error.message
        );

    }

}


/* =====================================================
   RESULT
===================================================== */

function renderResult(){

    const title =
        document.getElementById(
            "resultTitle"
        );

    const subtitle =
        document.getElementById(
            "resultSubtitle"
        );

    const details =
        document.getElementById(
            "resultDetails"
        );

    const prize =
        document.getElementById(
            "resultPrize"
        );

    const number =
        document.getElementById(
            "resultNumber"
        );

    const countdown =
        document.getElementById(
            "resultCountdown"
        );


    const winner =
        state.winner;


    if(
        winner &&
        String(winner.user_id) ===
        String(USER_ID)
    ){

        title.className =
            "result-title";

        title.textContent =
            "🏆 WINNER!";

        subtitle.textContent =
            "Congratulations, you won!";

        details.innerHTML =
            "Cartela: <b>" +
            winner.cartela +
            "</b><br>" +
            "You won by: <b>" +
            (
                winner.pattern ||
                "Bingo"
            ) +
            "</b>";

        prize.textContent =
            "💰 You won " +
            (
                winner.amount ||
                state.prize ||
                0
            );

    }

    else if(winner){

        title.className =
            "result-title result-loser";

        title.textContent =
            "🏆 WINNER";

        subtitle.textContent =
            "Congratulations to the winner!";

        details.innerHTML =
            "Winning Cartela: <b>" +
            winner.cartela +
            "</b><br>" +
            "Winning pattern: <b>" +
            (
                winner.pattern ||
                "Bingo"
            ) +
            "</b>";

        prize.textContent =
            "💰 Prize: " +
            (
                state.prize ||
                0
            );

    }

    else{

        title.className =
            "result-title result-loser";

        title.textContent =
            "GAME FINISHED";

        subtitle.textContent =
            "No winner this round.";

        details.textContent =
            "Better luck next game!";

        prize.textContent = "";

    }


    const winningCall =
        state.winning_call ||
        (
            winner &&
            winner.number
        ) ||
        state.current;


    if(winningCall){

        number.textContent =
            bingoLetter(
                winningCall
            ) +
            "-" +
            winningCall;

    }else{

        number.textContent = "—";

    }


    countdown.textContent =
        "Next game in " +
        (
            state.result_remaining ??
            0
        ) +
        " sec";

}


/* =====================================================
   INITIAL LOAD
===================================================== */

loadState();


/* =====================================================
   UPDATE EVERY SECOND
===================================================== */

setInterval(
    loadState,
    1000
);

</script>
