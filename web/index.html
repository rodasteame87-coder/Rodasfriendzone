<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rodas Friend Zone Bingo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#e3f4f9; --cream:#fffdf3; --purple:#7b0a82; --title:#5b1070;
    --green:#16a34a; --row:#efe6f5; --cell:#efecf2; --cellmark:#cdf0d8; --ink:#2b2b33;
    --shadow:0 1px 2px rgba(40,10,60,.08),0 2px 8px rgba(40,10,60,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:14px}
  body{padding:8px 10px 76px;max-width:520px;margin:0 auto}
  h1{margin:4px 0 10px;text-align:center;color:var(--title);font-size:17px;font-weight:700}
  button{border:0;border-radius:10px;color:#fff;font-weight:700;font-size:14px;padding:0;height:42px;cursor:pointer;width:100%}
  button:active{transform:scale(.98)} button:disabled{opacity:.45}

  /* shared */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .stat{background:var(--cream);border-radius:10px;padding:6px 2px;text-align:center;box-shadow:var(--shadow)}
  .stat small{display:block;color:var(--purple);font-weight:600;font-size:11px}
  .stat b{font-size:18px;color:#1d1d24}
  .panel{background:#fff;border-radius:12px;box-shadow:var(--shadow)}

  /* lobby */
  .bar{background:var(--purple);color:#fff;text-align:center;font-weight:700;font-size:16px;padding:10px;margin:-8px -10px 12px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:2px 2px}
  .live{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--title)}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.2)}
  .bal{font-weight:600;color:var(--title);font-size:13px}.bal b{font-size:17px}
  .gt{font-size:17px;font-weight:700;color:var(--title);margin:14px 2px 8px}
  .pill{background:#fff;border-radius:12px;display:grid;grid-template-columns:.8fr 1.2fr 1.4fr;padding:10px 8px;
        font-weight:700;color:var(--title);font-size:11px;text-align:center;margin-bottom:8px;box-shadow:var(--shadow)}
  .gcard{display:grid;grid-template-columns:28% 1fr;border-radius:14px;overflow:hidden;background:var(--cream);box-shadow:var(--shadow)}
  .gl{background:var(--purple);color:#fff;text-align:center;padding:16px 4px;font-weight:700;display:flex;flex-direction:column;justify-content:center}
  .gl b{display:block;font-size:32px;line-height:1}.gl span{font-size:12px;opacity:.9;margin-top:4px}
  .gm{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:8px}
  .win{text-align:center;color:var(--title);font-weight:600;font-size:12px}
  .win b{display:block;font-size:22px;color:var(--green)}
  .gr{display:flex;flex-direction:column;gap:6px;min-width:96px}
  .ready{background:#d9f1e0;color:#15803d;border-radius:8px;padding:6px;text-align:center;font-weight:700;font-size:11px}
  .joinbtn{background:var(--green);height:38px;border-radius:10px;font-size:15px}
  .practice{margin-top:12px;background:#d9f2f8;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--title)}
  .practice b{font-size:15px}.practice p{margin:3px 0 0;font-size:12px;color:#5b3a82}
  .practice button{background:var(--purple);width:84px;height:38px;font-size:14px}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;max-width:520px;margin:0 auto;padding:6px 0 8px;border-top:1px solid #eee}
  .nav div{flex:1;text-align:center;font-weight:600;font-size:11px;color:#777;cursor:pointer}
  .nav div i{display:block;font-style:normal;font-size:22px;margin-bottom:1px}
  .nav div.on{color:var(--title)}
  .pane{padding:18px 8px;font-size:15px;font-weight:600;color:var(--title);line-height:1.6}

  /* picker: 10 per row */
  .pickTitle{background:var(--cream);border-radius:12px;text-align:center;color:var(--title);font-size:17px;font-weight:700;padding:10px 6px;margin-bottom:10px;box-shadow:var(--shadow)}
  .pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .num{background:#fff;border:1.5px solid #b98bd0;border-radius:7px;color:var(--title);font-weight:700;font-size:12px;
       height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
  .num.taken{background:#ddd6e2;border-color:#d0c8d6;color:#9a93a0;pointer-events:none}
  .num.mine{background:var(--green);border-color:var(--green);color:#fff}
  .back{background:transparent;color:var(--title);width:auto;height:auto;font-size:14px;padding:2px 4px;margin-bottom:2px}

  /* modal */
  #modal{position:fixed;inset:0;background:rgba(20,5,30,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
  .mbox{background:#fff;border-radius:16px;padding:14px;width:100%;max-width:340px}
  .mbox h3{margin:0 0 10px;text-align:center;color:var(--title);font-size:16px}
  .mbox .cell{height:40px;font-size:15px;cursor:default}
  .mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .mbtns button{height:42px;font-size:14px}

  /* game */
  .main{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:8px;align-items:start}
  .calls{background:var(--cream);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .calls h3{margin:0;padding:7px 0;text-align:center;color:var(--purple);font-size:12px;font-weight:700}
  .calls table{width:100%;border-collapse:collapse;table-layout:fixed}
  .calls th{color:#fff;font-size:13px;padding:5px 0}
  .calls th:nth-child(1){background:#16a34a}.calls th:nth-child(2){background:#f4891f}
  .calls th:nth-child(3){background:#16a34a}.calls th:nth-child(4){background:#e5262e}.calls th:nth-child(5){background:#8a0f9a}
  .calls td{background:var(--row);text-align:center;font-weight:600;font-size:11px;color:#666;height:25px}
  .calls td.on{background:var(--green);color:#fff}
  .right{display:flex;flex-direction:column;gap:8px}
  .current{background:var(--purple);color:#fff;text-align:center;padding:10px 0 12px}
  .current h3{margin:0 0 8px;font-size:13px;font-weight:600}
  .ball{width:80px;height:80px;border-radius:50%;margin:0 auto;background:#ff9800;border:3px solid #fff;
        display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;white-space:nowrap}
  .lastbox{display:flex;align-items:center;gap:6px;padding:8px}
  .lastbox .big{flex:none;width:54px;height:54px;border-radius:50%;background:#2f6fe0;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap}
  #recent{display:flex;gap:4px;flex-wrap:wrap}
  #recent span{background:#efe6f5;color:var(--title);font-weight:700;font-size:11px;padding:4px 6px;border-radius:8px}
  .auto{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:600;font-size:14px;color:#222}
  .switch{position:relative;width:44px;height:26px}.switch input{display:none}
  .switch span{position:absolute;inset:0;background:#c4c4c4;border-radius:20px;transition:.2s}
  .switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked+span{background:var(--green)}.switch input:checked+span::after{left:21px}
  .card{padding:10px}
  .card h3{margin:0 0 8px;text-align:center;color:var(--title);font-size:13px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .grid .h{color:#fff;text-align:center;font-weight:700;font-size:13px;padding:6px 0;border-radius:4px}
  .grid .h:nth-child(1){background:#2f5fd0}.grid .h:nth-child(2){background:#e8453c}.grid .h:nth-child(3){background:#1e9a4a}
  .grid .h:nth-child(4){background:#e29a10}.grid .h:nth-child(5){background:#8a0f9a}
  .cell{background:var(--cell);text-align:center;font-weight:600;font-size:15px;color:#333;height:36px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;user-select:none;margin:0;padding:0}
  .cell.m{background:var(--cellmark);color:#15803d}
  .cell.freecell{font-size:11px;cursor:default}
  .cardno{text-align:center;color:var(--title);font-weight:700;font-size:13px;margin:10px 0 8px}
  .winb{background:#f39c1b;margin-bottom:8px;height:44px;font-size:15px}
  .btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .leave{background:#e8212f;height:38px}.rf{background:#1565d8;height:38px}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center;z-index:9}
  #toast.show{opacity:1}
</style>
</head>
<body>

<!-- ============ LOBBY ============ -->
<div id="lobby">
  <div class="bar">Rodas Friend Zone Bingo</div>
  <div id="tab-game">
    <div class="top">
      <div class="live"><span class="dot"></span>Live</div>
      <div class="bal">💳 Balance: <b id="bal">0.00</b></div>
    </div>
    <div class="gt">🎯 BINGO GAMES</div>
    <div class="pill"><span>BET</span><span>WIN / PLAYER</span><span>STATUS &amp; JOIN</span></div>
    <div class="gcard">
      <div class="gl"><b id="lbBet">10</b><span>BIRR</span></div>
      <div class="gm">
        <div class="win">🏆 <b id="lbWin">0</b><span id="lbPlayers">0 players</span></div>
        <div class="gr">
          <div class="ready" id="lbStatus">READY</div>
          <button class="joinbtn" id="joinBtn">JOIN</button>
        </div>
      </div>
    </div>
    <div class="practice">
      <div><b>🎮 FREE</b><p>Practice Mode — No Real Money</p></div>
      <button id="openFree">OPEN</button>
    </div>
  </div
