/* =========================================================
   HEADER
========================================================= */

.header {

    background: #760080;

}

.title {

/* =========================================================
   INFO CARDS
========================================================= */

.info-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;

}

.info-card {

.info-label {

}

.info-value {

    font-weight: 900;
}

/* =========================================================
   CHOOSE BANNER
========================================================= */

.choose-banner {

    text-align: center;
    font-size: 17px;
    font-weight: 900;

}

/* =========================================================
   CARTELA GRID
========================================================= */

.cartela-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    background: rgba(255,255,255,.35);
    border-radius: 17px;
    padding: 7px;
}

.cartela {
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border: 2px solid #8b2695;
    border-radius: 9px;
    color: #760080;
    font-size: 14px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .15s ease;
}

.cartela:active {
    transform: scale(.93);
}

.cartela.selected {

    color: white;
    border-color: #760080;
    box-shadow: 0 3px 9px rgba(118,0,128,.3);

/* =========================================================

========================================================= */

</div><div

/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram
    ? window.Telegram.WebApp
    : null;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =========================================================
   API
========================================================= */

const API = "";


/* =========================================================
   USER ID
========================================================= */

function getUserId() {

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.id
    ) {
        return String(
            tg.initDataUnsafe.user.id
        );
    }

    let saved =
        localStorage.getItem(
            "rodas_user_id"
        );

    if (!saved) {

        saved =
            "web-" +
            Math.random()
                .toString(36)
                .substring(2, 12);

        localStorage.setItem(
            "rodas_user_id",
            saved
        );
    }

    return saved;
}


const USER_ID = getUserId();


/* =========================================================
   STATE
========================================================= */

let state = null;

let selectedCartela = null;

let selectedBoard = null;

let polling = null;

let localSelectionTimer = 30;

let localGameTimer = 30;

let gameStartedAt = null;


/* =========================================================
   MESSAGE
========================================================= */

let messageTimeout = null;

function showMessage(text) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.classList.add("show");

    clearTimeout(
        messageTimeout
    );

    messageTimeout = setTimeout(
        () => {
            box.classList.remove(
                "show"
            );
        },
        2200
    );
}


/* =========================================================
   NUMBER GENERATOR
   Every cartela number gets a deterministic
   unique 5x5 card.
========================================================= */

function seededRandom(seed) {

    let x = seed;

    return function() {

        x =
            (x * 9301 + 49297)
            % 233280;

        return x / 233280;
    };
}


function generateBoard(cartelaNumber) {

    const random =
        seededRandom(
            1000 +
            Number(cartelaNumber) * 7919
        );

    function makeColumn(
        start,
        end
    ) {

        const numbers = [];

        for (
            let n = start;
            n <= end;
            n++
        ) {
            numbers.push(n);
        }

        for (
            let i = numbers.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    random() * (i + 1)
                );

            [
                numbers[i],
                numbers[j]
            ] = [
                numbers[j],
                numbers[i]
            ];
        }

        return numbers.slice(0, 5);
    }


    const B =
        makeColumn(1, 15);

    const I =
        makeColumn(16, 30);

    const N =
        makeColumn(31, 45);

    const G =
        makeColumn(46, 60);

    const O =
        makeColumn(61, 75);


    const board = [];

    for (
        let row = 0;
        row < 5;
        row++
    ) {

        board.push([
            B[row],
            I[row],
            row === 2
                ? "FREE"
                : N[row],
            G[row],
            O[row]
        ]);
    }

    return board;
}


/* =========================================================
   RENDER CARTELA GRID
========================================================= */

function createCartelaGrid() {

    const grid =
        document.getElementById(
            "cartelaGrid"
        );

    grid.innerHTML = "";

    for (
        let number = 1;
        number <= 100;
        number++
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "cartela";

        button.textContent =
            number;

        button.dataset.number =
            number;

        button.addEventListener(
            "click",
            () => {

                selectCartela(
                    number
                );

            }
        );

        grid.appendChild(
            button
        );
    }
}


/* =========================================================
   SELECT / UNSELECT CARTELA
========================================================= */

async function selectCartela(
    number
) {

    const button =
        document.querySelector(
            `.cartela[data-number="${number}"]`
        );

    if (
        selectedCartela === number
    ) {

        selectedCartela = null;
        selectedBoard = null;

        if (button) {
            button.classList.remove(
                "selected"
            );
        }

        hidePreview();

        await sendSelect(
            null
        );

        return;
    }


    selectedCartela =
        number;

    selectedBoard =
        generateBoard(
            number
        );


    document
        .querySelectorAll(
            ".cartela.selected"
        )
        .forEach(
            element => {
                element.classList.remove(
                    "selected"
                );
            }
        );


    if (button) {
        button.classList.add(
            "selected"
        );
    }


    showPreview(
        number,
        selectedBoard
    );


    await sendSelect(
        number
    );
}


/* =========================================================
   SEND CARTELA
========================================================= */

async function sendSelect(
    number
) {

    try {

        const response =
            await fetch(
                API +
                "/api/select",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-User-ID":
                            USER_ID
                    },

                    body:
                        JSON.stringify({
                            cartela:
                                number,

                            name:
                                getPlayerName()
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Unable to select cartela."
            );

            return;
        }


        state = data;

        updateState(
            data
        );

    } catch (error) {

        console.error(
            error
        );

        showMessage(
            "Connection error."
        );
    }
}


/* =========================================================
   PLAYER NAME
========================================================= */

function getPlayerName() {

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
    ) {

        return (
            tg.initDataUnsafe.user.first_name ||
            "Player"
        );
    }

    return "Player";
}


/* =========================================================
   PREVIEW
========================================================= */

function showPreview(
    number,
    board
) {

    const box =
        document.getElementById(
            "previewCard"
        );

    const title =
        document.getElementById(
            "previewNumber"
        );

    const boardBox =
        document.getElementById(
            "previewBoard"
        );


    box.classList.remove(
        "hidden"
    );


    title.textContent =
        "Cartela #" +
        number;


    boardBox.innerHTML = "";


    board.forEach(
        row => {

            row.forEach(
                value => {

                    const cell =
                        document.createElement(
                            "div"
                        );

                    cell.className =
                        "small-cell";

                    cell.textContent =
                        value;

                    if (
                        value === "FREE"
                    ) {
                        cell.classList.add(
                            "free"
                        );
                    }

                    boardBox.appendChild(
                        cell
                    );
                }
            );
        }
    );
}


function hidePreview() {

    document
        .getElementById(
            "previewCard"
        )
        .classList.add(
            "hidden"
        );
}


/* =========================================================
   UPDATE INFO
========================================================= */

function updateState(
    data
) {

    if (!data) {
        return;
    }

    state = data;


    /* PLAYERS */

    const players =
        data.player_count ??
        data.players ??
        0;

    document
        .getElementById(
            "playersValue"
        )
        .textContent =
            players;

    document
        .getElementById(
            "gamePlayers"
        )
        .textContent =
            players;


    /* WALLET */

    const wallet =
        data.wallet ??
        data.balance ??
        0;

    document
        .getElementById(
            "walletValue"
        )
        .textContent =
            wallet;

    document
        .getElementById(
            "gameWallet"
        )
        .textContent =
            wallet;


    /* SERVER SELECTION TIMER */

    if (
        data.phase ===
        "selection"
    ) {

        if (
            typeof data.selection_remaining
            === "number"
        ) {

            localSelectionTimer =
                data.selection_remaining;
        }
    }


    /* GAME */

    if (
        data.phase ===
        "playing"
    ) {

        showGameScreen();

        renderGame(
            data
        );
    }


    if (
        data.phase ===
        "starting"
    ) {

        /*
         * The backend has a short 3-second
         * starting phase. Keep the game screen
         * hidden until actual play begins.
         */
    }


    if (
        data.phase ===
        "result"
    ) {

        showGameScreen();

        renderGame(
            data
        );
    }


    if (
        data.phase ===
        "selection"
    ) {

        if (
            !document
                .getElementById(
                    "gameScreen"
                )
                .classList.contains(
                    "hidden"
                )
        ) {

            showSelectionScreen();
        }
    }
}


/* =========================================================
   GET STATE
========================================================= */

async function fetchState() {

    try {

        const response =
            await fetch(
                API +
                "/api/state",
                {
                    method: "GET",

                    headers: {
                        "X-User-ID":
                            USER_ID
                    },

                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        updateState(
            data
        );


        syncSelectedCartela(
            data
        );


    } catch (error) {

        console.error(
            "State error:",
            error
        );
    }
}


/* =========================================================
   SYNC SELECTED CARTELA
========================================================= */

function syncSelectedCartela(
    data
) {

    if (
        data.my_cartela !== null &&
        data.my_cartela !== undefined
    ) {

        const number =
            Number(
                data.my_cartela
            );

        selectedCartela =
            number;

        selectedBoard =
            generateBoard(
                number
            );


        document
            .querySelectorAll(
                ".cartela"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "selected",
                        Number(
                            button.dataset.number
                        ) === number
                    );
                }
            );


        showPreview(
            number,
            selectedBoard
        );

    } else {

        selectedCartela = null;
        selectedBoard = null;

        document
            .querySelectorAll(
                ".cartela.selected"
            )
            .forEach(
                button => {
                    button.classList.remove(
                        "selected"
                    );
                }
            );

        hidePreview();
    }
}


/* =========================================================
   PROCEED
========================================================= */

async function proceed() {

    if (
        !selectedCartela
    ) {

        showMessage(
            "Please select a cartela first."
        );

        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/api/proceed",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-User-ID":
                            USER_ID
                    },

                    body:
                        JSON.stringify({
                            user_id:
                                USER_ID
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            showMessage(
                data.message ||
                "Unable to proceed."
            );

            return;
        }


        state = data;

        showMessage(
            "Game starting..."
        );


        /*
         * Poll immediately.
         * The backend will move:
         *
         * selection
         * -> starting
         * -> playing
         */

        await fetchState();

    } catch (error) {

        console.error(
            error
        );

        showMessage(
            "Connection error."
        );
    }
}


/* =========================================================
   LEAVE
========================================================= */

async function leaveGame() {

    try {

        await fetch(
            API +
            "/api/leave",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "X-User-ID":
                        USER_ID
                },

                body:
                    JSON.stringify({
                        user_id:
                            USER_ID
                    })
            }
        );

    } catch (error) {

        console.error(
            error
        );
    }


    selectedCartela = null;
    selectedBoard = null;

    showSelectionScreen();

    await fetchState();
}


/* =========================================================
   REFRESH SELECTION
========================================================= */

async function refreshSelection() {

    showMessage(
        "Refreshing..."
    );

    await fetchState();

    showSelectionScreen();
}


/* =========================================================
   SHOW SELECTION
========================================================= */

function showSelectionScreen() {

    document
        .getElementById(
            "selectionScreen"
        )
        .classList.remove(
            "hidden"
        );

    document
        .getElementById(
            "gameScreen"
        )
        .classList.add(
            "hidden"
        );
}


/* =========================================================
   SHOW GAME
========================================================= */

function showGameScreen() {

    document
        .getElementById(
            "selectionScreen"
        )
        .classList.add(
            "hidden"
        );

    document
        .getElementById(
            "gameScreen"
        )
        .classList.remove(
            "hidden"
        );
}


/* =========================================================
   RENDER GAME
========================================================= */

function renderGame(
    data
) {

    if (!data) {
        return;
    }


    /* STATUS */

    const status =
        document.getElementById(
            "gameStatus"
        );


    if (
        data.phase ===
        "playing"
    ) {

        status.textContent =
            "🟢 GAME LIVE";

    } else if (
        data.phase ===
        "result"
    ) {

        status.textContent =
            "🏆 GAME RESULT";

    } else {

        status.textContent =
            "GAME";
    }


    /* =====================================================
       CURRENT CALL

       IMPORTANT:
       Always use the latest item from
       called_numbers / called / drawn_numbers.

       This prevents an old Current Call from
       being displayed.
    ===================================================== */

    let called =
        Array.isArray(
            data.called_numbers
        )
            ? data.called_numbers
            : Array.isArray(
                data.called
            )
                ? data.called
                : Array.isArray(
                    data.drawn_numbers
                )
                    ? data.drawn_numbers
                    : [];


    called =
        called.map(
            Number
        ).filter(
            Number.isFinite
        );


    let latest = null;


    if (called.length > 0) {

        latest =
            called[
                called.length - 1
            ];

    } else if (
        data.last_called !== null &&
        data.last_called !== undefined
    ) {

        latest =
            Number(
                data.last_called
            );
    }


    const current =
        document.getElementById(
            "currentNumber"
        );


    if (
        latest !== null &&
        Number.isFinite(
            latest
        )
    ) {

        current.textContent =
            latest;

        current.classList.remove(
            "empty"
        );

    } else {

        current.textContent =
            "—";

        current.classList.add(
            "empty"
        );
    }


    /* =====================================================
       CALLED HISTORY
    ===================================================== */

    const list =
        document.getElementById(
            "calledList"
        );

    list.innerHTML = "";


    called.forEach(
        number => {

            const ball =
                document.createElement(
                    "div"
                );

            ball.className =
                "called-ball";

            ball.textContent =
                number;

            list.appendChild(
                ball
            );
        }
    );


    /* =====================================================
       GAME CARD
    ===================================================== */

    let board =
        data.card ||
        data.my_board ||
        selectedBoard;


    if (
        !board &&
        selectedCartela
    ) {

        board =
            generateBoard(
                selectedCartela
            );
    }


    if (board) {

        selectedBoard =
            board;

        renderGameBoard(
            board,
            called
        );
    }


    /* =====================================================
       RESULT / WINNER
    ===================================================== */

    const winnerBox =
        document.getElementById(
            "winnerBox"
        );

    if (
        data.winner
    ) {

        winnerBox.classList.remove(
            "hidden"
        );

        document
            .getElementById(
                "winnerText"
            )
            .textContent =
                String(
                    data.winner
                );

    } else {

        winnerBox.classList.add(
            "hidden"
        );
    }
}


/* =========================================================
   RENDER GAME BOARD
========================================================= */

function renderGameBoard(
    board,
    called
) {

    const gameBoard =
        document.getElementById(
            "gameBoard"
        );

    gameBoard.innerHTML = "";


    const calledSet =
        new Set(
            called.map(
                Number
            )
        );


    board.forEach(
        row => {

            row.forEach(
                value => {

                    const cell =
                        document.createElement(
                            "div"
                        );

                    cell.className =
                        "bingo-cell";


                    if (
                        value === "FREE"
                    ) {

                        cell.textContent =
                            "FREE";

                        cell.classList.add(
                            "free"
                        );

                    } else {

                        const number =
                            Number(
                                value
                            );

                        cell.textContent =
                            number;


                        /*
                         * Highlight only if the
                         * number is actually in the
                         * backend's called-number list.
                         */

                        if (
                            calledSet.has(
                                number
                            )
                        ) {

                            cell.classList.add(
                                "called"
                            );
                        }
                    }


                    gameBoard.appendChild(
                        cell
                    );
                }
            );
        }
    );
}


/* =========================================================
   CLAIM BINGO
========================================================= */

async function claimBingo() {

    try {

        const response =
            await fetch(
                API +
                "/api/claim",
                {
                    method: "POST",

                    headers: {

                        "X-User-ID":

                    },

                    body:

                        })
                }
            );

        ) {

            );

        );

            error
        );

        showMessage(
            "Connection error."
        );
    }
}


/* =========================================================
   LOCAL TIMER
========================================================= */

function timerLoop() {

    /*
     * Selection timer.
     *
     * Backend remains the authority.
     * This only makes the screen count down
     * smoothly between API updates.
     */

    if (
        state &&
        state.phase ===
        "selection"
    ) {

        if (
            localSelectionTimer > 0
        ) {

            localSelectionTimer--;

            document
                .getElementById(
                    "selectionTime"
                )
                .textContent =
                    localSelectionTimer;
        }

    }


    /*
     * Game timer.
     *
     * The actual game state comes from the
     * backend. This display prevents the UI
     * from appearing frozen while polling.
     */

    if (
        state &&
        (
            state.phase ===
            "playing" ||
            state.phase ===
            "result"
        )
    ) {

        if (
            localGameTimer > 0
        ) {

            localGameTimer--;

            document
                .getElementById(
                    "gameTime"
                )
                .textContent =
                    localGameTimer;
        }
    }


    setTimeout(
        timerLoop,
        1000
    );
}


/* =========================================================
   SERVER TIMER SYNC
========================================================= */

function syncTimers(
    data
) {

    if (
        !data
    ) {
        return;
    }


    if (
        data.phase ===
        "selection"
    ) {

        if (
            typeof data.selection_remaining
            === "number"
        ) {

            localSelectionTimer =
                data.selection_remaining;

            document
                .getElementById(
                    "selectionTime"
                )
                .textContent =
                    localSelectionTimer;
        }
    }


    if (
        data.phase ===
        "playing"
    ) {

        /*
         * Keep the game timer at 30 on the
         * first transition into playing.
         */

        if (
            !gameStartedAt
        ) {

            gameStartedAt =
                Date.now();

            localGameTimer =
                30;
        }

        const elapsed =
            Math.floor(
                (
                    Date.now()
                    - gameStartedAt
                ) / 1000
            );

        localGameTimer =
            Math.max(
                0,
                30 - elapsed
            );

        document
            .getElementById(
                "gameTime"
            )
            .textContent =
                localGameTimer;
    }


    if (
        data.phase ===
        "result"
    ) {

        document
            .getElementById(
                "gameTime"
            )
            .textContent =
                data.result_remaining ??
                0;
    }
}


/* =========================================================
   POLLING
========================================================= */

function startPolling() {

    if (polling) {
        clearInterval(
            polling
        );
    }


    polling =
        setInterval(
            async () => {

                await fetchState();

                if (state) {
                    syncTimers(
                        state
                    );
                }

            },
            500
        );
}

   BUTTONS
========================================================= */

document
    .getElementById(

/* =========================================================
   START
========================================================= */

createCartelaGrid();

startPolling();

timerLoop();

fetchState();
