<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RodasFriendZone Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#dff5ff;
    color:#17465b;
}

body{
    min-height:100vh;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:9px 7px 24px;

    background:
        radial-gradient(
            circle at 50% -10%,
            #ffffff 0,
            #eafaff 25%,
            #d8f3ff 65%,
            #c8edf9 100%
        );
}


/* =========================================================
   TOP INFORMATION
   ========================================================= */

.top{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
}

.info-box{
    min-width:0;
    padding:7px 3px 8px;

    border-radius:11px;

    background:#fffef1;

    border:1px solid #cfe6ec;

    text-align:center;

    box-shadow:
        0 3px 8px rgba(40,120,150,.10);
}

.info-label{
    display:block;

    color:#8a257e;

    font-size:10px;
    font-weight:900;

    white-space:nowrap;
}

.info-value{
    display:block;

    margin-top:3px;

    color:#111827;

    font-size:15px;
    font-weight:900;
}


/* =========================================================
   PLAYING AREA
   ========================================================= */

.game-layout{
    display:grid;

    grid-template-columns:42% 58%;

    gap:7px;

    margin-top:7px;
}


/* =========================================================
   LEFT 75 NUMBER BOARD
   ========================================================= */

.call-board{
    min-width:0;

    padding:3px;

    background:rgba(255,255,255,.20);

    border:1px solid rgba(95,172,199,.18);

    border-radius:7px;
}

.call-head{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:3px;

    margin-bottom:4px;
}

.call-head div{
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:6px;

    color:#fff;

    font-size:17px;
    font-weight:900;
}


/* B I N G O header colors */

.call-head .b{
    background:#11952f;
}

.call-head .i{
    background:#f58b28;
}

.call-head .n{
    background:#132fe0;
}

.call-head .g{
    background:#ed1118;
}

.call-head .o{
    background:#86127d;
}


.call-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:3px;
}

.call-number{
    height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:#c9c9e5;

    border:1px solid rgba(255,255,255,.85);

    color:#ffffff;

    font-size:15px;
    font-weight:900;

    transition:
        background .15s ease,
        transform .1s ease;
}


/* called numbers */

.call-number.called{
    color:#fff;
}


/* Current number gets stronger highlight */

.call-number.current{
    background:#10a83d !important;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.8);

    transform:scale(1.02);
}


/* Number color based on BINGO column */

.call-number.b-called{
    background:#28a93d;
}

.call-number.i-called{
    background:#f58b28;
}

.call-number.n-called{
    background:#152fe0;
}

.call-number.g-called{
    background:#ed1118;
}

.call-number.o-called{
    background:#86127d;
}


/* =========================================================
   RIGHT SIDE
   ========================================================= */

.right-side{
    min-width:0;
}


/* =========================================================
   CURRENT CALL
   ========================================================= */

.current-call{
    min-height:75px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 10px 8px 14px;

    border-radius:40px;

    background:#8a007f;

    color:#ffffff;

    box-shadow:
        0 5px 15px rgba(105,0,100,.16);
}

.current-call-title{
    font-size:20px;
    font-weight:900;
}

.current-ball{
    width:60px;
    height:60px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ff8a00;

    color:#fff;

    font-size:17px;
    font-weight:900;

    box-shadow:
        inset 0 -3px 0 rgba(0,0,0,.08);
}


/* =========================================================
   RECENT CALLS
   ========================================================= */

.recent-box{
    margin-top:10px;

    min-height:74px;

    padding:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    background:rgba(255,255,255,.62);

    border:1px solid rgba(255,255,255,.9);
}

.recent-list{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:7px;

    flex-wrap:wrap;
}

.recent-ball{
    width:49px;
    height:49px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    font-size:12px;
    font-weight:900;
}

.recent-ball.b{
    background:#1233df;
}

.recent-ball.i{
    background:#f58b28;
}

.recent-ball.n{
    background:#1233df;
}

.recent-ball.g{
    background:#ed1118;
}

.recent-ball.o{
    background:#86127d;
}


/* =========================================================
   AUTO
   ========================================================= */

.auto-box{
    height:47px;

    margin-top:10px;

    padding:6px 10px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    gap:10px;

    border-radius:11px;

    background:rgba(255,255,255,.52);

    border:1px solid rgba(255,255,255,.85);

    color:#333;

    font-size:14px;
    font-weight:900;
}

.auto-switch{
    width:61px;
    height:30px;

    position:relative;

    border-radius:20px;

    background:#49b75d;
}

.auto-switch::after{
    content:"";

    position:absolute;

    top:4px;
    right:4px;

    width:22px;
    height:22px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:0 1px 3px rgba(0,0,0,.20);
}


/* =========================================================
   MESSAGE AREA
   ========================================================= */

.waiting-area{
    min-height:225px;

    margin-top:10px;

    padding:18px 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:rgba(218,199,250,.55);

    border:1px solid rgba(255,255,255,.35);

    border-radius:3px;
}

.waiting-message{
    color:#74127b;

    font-size:19px;
    font-weight:900;

    line-height:1.35;
}


/* =========================================================
   CHOSEN CARTELA
   ========================================================= */

.chosen-box{
    margin-top:10px;

    padding:10px;

    border-radius:14px;

    background:#ffffff;

    border:1px solid #b9dfeb;

    text-align:center;

    box-shadow:
        0 5px 15px rgba(30,120,150,.10);
}

.chosen-label{
    color:#62899a;

    font-size:10px;
    font-weight:900;

    letter-spacing:.5px;
}

.chosen-number{
    margin-top:3px;

    color:#087ca9;

    font-size:20px;
    font-weight:900;
}


/* =========================================================
   PLAYER BINGO CARD
   ========================================================= */

.player-card{
    margin-top:8px;

    padding:7px;

    border-radius:14px;

    background:#ffffff;

    border:1px solid #b9dfeb;
}

.player-card-head{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:3px;

    margin-bottom:3px;
}

.player-card-head div{
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:5px;

    background:#159fd0;

    color:#ffffff;

    font-size:12px;
    font-weight:900;
}

.player-card-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:3px;
}

.player-cell{
    min-height:39px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:6px;

    background:#f0f9fc;

    border:1px solid #d2e9ef;

    color:#18495b;

    font-size:13px;
    font-weight:900;
}

.player-cell.marked{
    background:#29b978;

    border-color:#20a567;

    color:#ffffff;
}

.player-cell.current{
    background:#4ec7ed;

    color:#06445a;

    box-shadow:
        0 0 0 2px rgba(78,199,237,.25);
}

.player-cell.free{
    background:#159fd0;

    border-color:#159fd0;

    color:#fff;

    font-size:9px;
}


/* =========================================================
   BOTTOM BUTTONS
   ========================================================= */

.bottom-actions{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:7px;

    margin-top:9px;
}

.bottom-button{
    border:0;

    border-radius:12px;

    padding:12px 8px;

    background:#ffffff;

    border:1px solid #afd9e7;

    color:#087ca9;

    font-size:12px;
    font-weight:900;

    box-shadow:
        0 4px 10px rgba(30,120,150,.08);
}

.bottom-button:active{
    transform:scale(.98);
}


/* =========================================================
   STATUS
   ========================================================= */

.game-status{
    min-height:18px;

    margin-top:8px;

    text-align:center;

    color:#5d8798;

    font-size:11px;
    font-weight:700;
}


/* =========================================================
   GAME OVER
   ========================================================= */

.game-over{
    margin-top:20px;

    padding:25px 15px;

    border-radius:20px;

    background:#ffffff;

    border:1px solid #b9dfeb;

    text-align:center;

    box-shadow:
        0 10px 30px rgba(30,120,150,.12);
}

.trophy{
    font-size:45px;
}

.game-over h2{
    margin:7px 0 4px;

    color:#087ca9;

    font-size:25px;
}

.game-over p{
    margin:5px 0;

    color:#628796;

    font-size:12px;
}

.prize{
    margin:13px auto;

    padding:10px 16px;

    width:max-content;

    border-radius:20px;

    background:#ffd84d;

    color:#315064;

    font-weight:900;
}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden{
    display:none !important;
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:380px){

    .app{
        padding-left:5px;
        padding-right:5px;
    }

    .game-layout{
        grid-template-columns:42% 58%;
        gap:5px;
    }

    .call-head{
        gap:2px;
    }

    .call-grid{
        gap:2px;
    }

    .call-number{
        height:43px;
        font-size:13px;
        border-radius:6px;
    }

    .call-head div{
        height:34px;
        font-size:15px;
    }

    .current-call{
        padding-left:10px;
    }

    .current-call-title{
        font-size:16px;
    }

    .current-ball{
        width:52px;
        height:52px;
        font-size:14px;
    }

    .recent-ball{
        width:42px;
        height:42px;
        font-size:10px;
    }

    .waiting-area{
        min-height:190px;
    }

    .waiting-message{
        font-size:16px;
    }

    .player-cell{
        min-height:34px;
        font-size:11px;
    }

}


/* VERY SMALL PHONES */

@media(max-width:330px){

    .info-label{
        font-size:8px;
    }

    .info-value{
        font-size:13px;
    }

    .call-number{
        height:39px;
        font-size:11px;
    }

    .call-head div{
        height:31px;
        font-size:13px;
    }

    .current-call-title{
        font-size:14px;
    }

    .current-ball{
        width:47px;
        height:47px;
        font-size:12px;
    }

}

</style>
</head>


<body>

<main class="app">


<!-- =====================================================
     TOP INFORMATION
     ===================================================== -->

<div class="top">

    <div class="info-box">
        <span class="info-label">Players</span>
        <span id="players" class="info-value">0</span>
    </div>

    <div class="info-box">
        <span class="info-label">Derash</span>
        <span id="derash" class="info-value">0</span>
    </div>

    <div class="info-box">
        <span class="info-label">Bet</span>
        <span id="bet" class="info-value">100</span>
    </div>

    <div class="info-box">
        <span class="info-label">Call Count</span>
        <span id="callCount" class="info-value">0</span>
    </div>

</div>


<!-- =====================================================
     GAME AREA
     ===================================================== -->

<section id="gameView">


<div class="game-layout">


    <!-- =================================================
         LEFT: 1-75 CALLING BOARD
         ================================================= -->

    <div class="call-board">

        <div class="call-head">
            <div class="b">B</div>
            <div class="i">I</div>
            <div class="n">N</div>
            <div class="g">G</div>
            <div class="o">O</div>
        </div>

        <div id="callGrid" class="call-grid"></div>

    </div>


    <!-- =================================================
         RIGHT SIDE
         ================================================= -->

    <div class="right-side">


        <!-- CURRENT CALL -->

        <div class="current-call">

            <div class="current-call-title">
                Current Call
            </div>

            <div id="currentBall" class="current-ball">
                —
            </div>

        </div>


        <!-- RECENT CALLS -->

        <div class="recent-box">

            <div id="recentList" class="recent-list">

                <div class="recent-ball n">
                    —
                </div>

            </div>

        </div>


        <!-- AUTO -->

        <div class="auto-box">

            <span>
                Auto
            </span>

            <div class="auto-switch"></div>

        </div>


        <!-- WAITING / GAME MESSAGE -->

        <div class="waiting-area">

            <div id="waitingMessage" class="waiting-message">
                Waiting for the game...
            </div>

        </div>


        <!-- CHOSEN CARTELA -->

        <div class="chosen-box">

            <div class="chosen-label">
                CHOSEN CARTELA
            </div>

            <div id="chosenCartela" class="chosen-number">
                —
            </div>

        </div>


        <!-- PLAYER CARD -->

        <div class="player-card">

            <div class="player-card-head">
                <div>B</div>
                <div>I</div>
                <div>N</div>
                <div>G</div>
                <div>O</div>
            </div>

            <div id="playerCardGrid" class="player-card-grid"></div>

        </div>


    </div>

</div>


<!-- =====================================================
     BUTTONS
     ===================================================== -->

<div class="bottom-actions">

    <button
        class="bottom-button"
        onclick="backToRooms()"
    >
        ← Leave
    </button>

    <button
        class="bottom-button"
        onclick="loadState()"
    >
        ↻ Refresh
    </button>

</div>


<div
    id="gameStatus"
    class="game-status"
>
    Numbers are called automatically.
</div>


</section>


<!-- =====================================================
     GAME OVER
     ===================================================== -->

<section
    id="gameOverView"
    class="hidden"
>

    <div class="game-over">

        <div class="trophy">
            🏆
        </div>

        <h2 id="winnerTitle">
            Game Over
        </h2>

        <p id="winnerText">
            The Bingo game has ended.
        </p>

        <div
            id="prize"
            class="prize hidden"
        >
            Prize: 0
        </div>

        <p>
            Preparing the next game...
        </p>

    </div>

</section>


</main>


<script>

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if(tg){

    tg.ready();

    tg.expand();

}


/* =========================================================
   STATE
   ========================================================= */

let state = {

    phase:"selection",

    timer:30,

    game:1,

    players:0,

    wallet:1000,

    taken:[],

    selected:null,

    cartela:null,

    called:[],

    current:null,

    card:null,

    winner:null,

    prize:0

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const playersElement =
    document.getElementById("players");

const derashElement =
    document.getElementById("derash");

const betElement =
    document.getElementById("bet");

const callCountElement =
    document.getElementById("callCount");

const callGrid =
    document.getElementById("callGrid");

const currentBall =
    document.getElementById("currentBall");

const recentList =
    document.getElementById("recentList");

const chosenCartela =
    document.getElementById("chosenCartela");

const playerCardGrid =
    document.getElementById("playerCardGrid");

const gameStatus =
    document.getElementById("gameStatus");

const waitingMessage =
    document.getElementById("waitingMessage");

const gameView =
    document.getElementById("gameView");

const gameOverView =
    document.getElementById("gameOverView");


/* =========================================================
   API
   ========================================================= */

async function api(url, options = {}){

    try{

        const response =
            await fetch(
                url,
                {
                    ...options,

                    headers:{
                        "Content-Type":"application/json",

                        ...(options.headers || {})
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }


        return await response.json();

    }catch(error){

        console.log(error);

        return null;

    }

}


/* =========================================================
   LOAD STATE
   ========================================================= */

async function loadState(){

    const data =
        await api(
            "/api/state"
        );


    if(!data){

        return;

    }


    state = {

        ...state,

        ...data

    };


    renderAll();

}


/* =========================================================
   RENDER ALL
   ========================================================= */

function renderAll(){

    playersElement.textContent =
        state.players ?? 0;


    /*
       Current backend calculates the prize
       from players. We display that as Derash
       until we add a dedicated money field.
    */

    const pool =
        Number(state.prize || 0) ||
        (
            Number(state.players || 0) * 100
        );


    derashElement.textContent =
        formatNumber(pool);


    /*
       Current game stake used by the backend.
    */

    betElement.textContent =
        "100";


    const called =
        Array.isArray(state.called)
            ? state.called
            : [];


    callCountElement.textContent =
        called.length;


    if(state.phase === "playing"){

        gameView.classList.remove(
            "hidden"
        );

        gameOverView.classList.add(
            "hidden"
        );

        renderGame();

    }else if(state.phase === "finished"){

        gameView.classList.add(
            "hidden"
        );

        gameOverView.classList.remove(
            "hidden"
        );

        renderGameOver();

    }else{

        /*
           If this page is opened during selection,
           the existing selection screen should still
           be used by the deployed version.
        */

        window.location.reload();

    }

}


/* =========================================================
   NUMBER -> BINGO LETTER
   ========================================================= */

function bingoLetter(number){

    number =
        Number(number);


    if(number >= 1 && number <= 15){
        return "B";
    }

    if(number >= 16 && number <= 30){
        return "I";
    }

    if(number >= 31 && number <= 45){
        return "N";
    }

    if(number >= 46 && number <= 60){
        return "G";
    }

    if(number >= 61 && number <= 75){
        return "O";
    }

    return "";

}


/* =========================================================
   COLUMN CLASS
   ========================================================= */

function columnClass(number){

    const letter =
        bingoLetter(number);

    return (
        letter
            ? letter.toLowerCase()
            : ""
    );

}


/* =========================================================
   RENDER 1-75 BOARD
   ========================================================= */

function renderCallingBoard(){

    callGrid.innerHTML = "";


    const called =
        new Set(
            (state.called || [])
                .map(Number)
        );


    const current =
        Number(state.current);


    /*
       1-15 B
       16-30 I
       31-45 N
       46-60 G
       61-75 O

       We display it row-by-row:
       1 16 31 46 61
       2 17 32 47 62
       ...
       15 30 45 60 75
    */

    for(let row = 0; row < 15; row++){

        for(let col = 0; col < 5; col++){

            const number =
                row + 1 + (col * 15);


            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "call-number";


            if(called.has(number)){

                cell.classList.add(
                    columnClass(number) +
                    "-called"
                );

                cell.classList.add(
                    "called"
                );

            }


            if(number === current){

                cell.classList.add(
                    "current"
                );

            }


            cell.textContent =
                number;


            callGrid.appendChild(
                cell
            );

        }

    }

}


/* =========================================================
   RENDER CURRENT CALL
   ========================================================= */

function renderCurrentCall(){

    const current =
        Number(state.current);


    if(!current){

        currentBall.textContent =
            "—";

        return;

    }


    currentBall.textContent =
        bingoLetter(current) +
        "-" +
        current;

}


/* =========================================================
   RENDER RECENT CALLS
   ========================================================= */

function renderRecentCalls(){

    recentList.innerHTML = "";


    const numbers =
        Array.isArray(state.called)
            ? [...state.called].reverse()
            : [];


    /*
       Show the three most recent calls,
       just like the reference design.
    */

    numbers
        .slice(0,3)
        .forEach(number => {

            const ball =
                document.createElement(
                    "div"
                );


            ball.className =
                "recent-ball " +
                columnClass(number);


            ball.textContent =
                bingoLetter(number) +
                "-" +
                number;


            recentList.appendChild(
                ball
            );

        });


    if(numbers.length === 0){

        const ball =
            document.createElement(
                "div"
            );


        ball.className =
            "recent-ball n";


        ball.textContent =
            "—";


        recentList.appendChild(
            ball
        );

    }

}


/* =========================================================
   RENDER PLAYER CARD
   ========================================================= */

function renderPlayerCard(){

    playerCardGrid.innerHTML = "";


    let card =
        state.card;


    if(!card){

        renderEmptyPlayerCard();

        return;

    }


    /*
       Support both:
       5 arrays of 5
       OR flat 25-number array.
    */

    if(
        Array.isArray(card) &&
        card.length === 25
    ){

        card = [

            card.slice(0,5),

            card.slice(5,10),

            card.slice(10,15),

            card.slice(15,20),

            card.slice(20,25)

        ];

    }


    if(
        !Array.isArray(card) ||
        card.length !== 5
    ){

        renderEmptyPlayerCard();

        return;

    }


    const called =
        new Set(
            (state.called || [])
                .map(Number)
        );


    const current =
        Number(state.current);


    for(let row = 0; row < 5; row++){

        for(let col = 0; col < 5; col++){

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "player-cell";


            const value =
                card[row][col];


            /*
               Center is FREE.
            */

            if(
                row === 2 &&
                col === 2
            ){

                cell.classList.add(
                    "free"
                );

                cell.textContent =
                    "FREE";


            }else{

                cell.textContent =
                    value;


                const number =
                    Number(value);


                if(called.has(number)){

                    cell.classList.add(
                        "marked"
                    );

                }


                if(
                    number === current &&
                    current
                ){

                    cell.classList.add(
                        "current"
                    );

                }

            }


            playerCardGrid.appendChild(
                cell
            );

        }

    }

}


/* =========================================================
   EMPTY PLAYER CARD
   ========================================================= */

function renderEmptyPlayerCard(){

    for(let i = 0; i < 25; i++){

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "player-cell";


        if(i === 12){

            cell.classList.add(
                "free"
            );

            cell.textContent =
                "FREE";

        }else{

            cell.textContent =
                "—";

        }


        playerCardGrid.appendChild(
            cell
        );

    }

}


/* =========================================================
   RENDER GAME
   ========================================================= */

function renderGame(){

    renderCallingBoard();

    renderCurrentCall();

    renderRecentCalls();

    renderPlayerCard();


    chosenCartela.textContent =
        state.cartela ||
        state.selected ||
        "—";


    if(state.current){

        waitingMessage.textContent =
            "Dear Player,\n\n" +
            "Game is in progress";


        gameStatus.textContent =
            "Current call: " +
            bingoLetter(state.current) +
            "-" +
            state.current;

    }else{

        waitingMessage.textContent =
            "Dear Player,\n\n" +
            "Please wait for the first call";


        gameStatus.textContent =
            "Waiting for the first number...";

    }

}


/* =========================================================
   LEAVE
   ========================================================= */

async function backToRooms(){

    const confirmed =
        confirm(
            "Leave your current game?"
        );


    if(!confirmed){

        return;

    }


    const data =
        await api(
            "/api/leave",
            {
                method:"POST"
            }
        );


    if(data){

        state = {

            ...state,

            ...data

        };


        renderAll();

    }

}


/* =========================================================
   GAME OVER
   ========================================================= */

function renderGameOver(){

    const winnerTitle =
        document.getElementById(
            "winnerTitle"
        );


    const winnerText =
        document.getElementById(
            "winnerText"
        );


    const prize =
        document.getElementById(
            "prize"
        );


    const winner =
        state.winner;


    winnerTitle.textContent =
        "BINGO! 🏆";


    if(
        winner &&
        typeof winner === "object"
    ){

        winnerText.textContent =
            "Winning Cartela: " +
            (
                winner.cartela ??
                "-"
            );

    }else if(winner){

        winnerText.textContent =
            "Winner: " +
            winner;

    }else{

        winnerText.textContent =
            "The Bingo game has ended.";

    }


    if(state.prize){

        prize.classList.remove(
            "hidden"
        );


        prize.textContent =
            "Prize: " +
            formatNumber(
                state.prize
            );

    }

}


/* =========================================================
   FORMAT NUMBER
   ========================================================= */

function formatNumber(value){

    const number =
        Number(value);


    if(Number.isNaN(number)){

        return value ?? "0";

    }


    return number.toLocaleString();

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(
    loadState,
    1000
);


/* =========================================================
   START
   ========================================================= */

loadState();

</script>
