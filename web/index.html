<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rodas Friend Zone Bingo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#c5ebf5; --cream:#fffbea; --purple:#9c00a0; --title:#7a0a8c;
    --b:#2f5fd0; --i:#e8453c; --n:#1e9a4a; --g:#e29a10; --o:#8a0f9a;
    --hb:#16a34a; --hi:#f4891f; --hn:#16a34a; --hg:#e5262e; --ho:#8a0f9a;
    --row:#e9dcf1; --mark:#16a34a; --cell:#ebe7ee; --cellmark:#c9f0d4;
    --ink:#3a3a3a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:var(--ink)}
  body{padding:8px 8px 24px;max-width:720px;margin:0 auto}
  h1{margin:6px 0 10px;text-align:center;color:var(--title);font-size:26px;font-weight:800}
  h1 span{font-size:30px;vertical-align:-3px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--cream);border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .stat small{display:block;color:var(--purple);font-weight:700;font-size:15px}
  .stat b{font-size:28px;color:#111}

  .main{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.4fr);gap:8px;align-items:start}

  .calls{background:var(--cream);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .calls h3{margin:0;padding:8px 0;text-align:center;color:var(--purple);font-size:16px}
  .calls table{width:100%;border-collapse:collapse;table-layout:fixed}
  .calls th{color:#fff;font-size:20px;padding:7px 0}
  .calls th:nth-child(1){background:var(--hb)} .calls th:nth-child(2){background:var(--hi)}
  .calls th:nth-child(3){background:var(--hn)} .calls th:nth-child(4){background:var(--hg)}
  .calls th:nth-child(5){background:var(--ho)}
  .calls td{background:var(--row);text-align:center;font-weight:700;font-size:15px;color:#555;height:37.5px;border:0}
  .calls td.on{background:var(--mark);color:#fff}

  .right{display:flex;flex-direction:column;gap:8px}
  .panel{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .current{background:var(--purple);color:#fff;text-align:center;padding:12px 0 16px}
  .current h3{margin:0 0 10px;font-size:20px}
  .ball{width:104px;height:104px;border-radius:50%;margin:0 auto;background:#ff9800;border:5px solid #fff;
        display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff}
  .last{display:flex;justify-content:center;padding:10px}
  .last div{width:82px;height:82px;border-radius:50%;background:#2f6fe0;color:#fff;font-size:34px;font-weight:800;
            display:flex;align-items:center;justify-content:center}
  .auto{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:700;font-size:20px;color:#222}
  .switch{position:relative;width:82px;height:46px}
  .switch input{display:none}
  .switch span{position:absolute;inset:0;background:#bbb;border-radius:30px;transition:.2s}
  .switch span::after{content:"";position:absolute;top:5px;left:5px;width:36px;height:36px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked+span{background:#16a34a}
  .switch input:checked+span::after{left:41px}

  .card{padding:12px 12px 12px}
  .card h3{margin:2px 0 10px;text-align:center;color:var(--title);font-size:20px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .grid .h{color:#fff;text-align:center;font-weight:800;font-size:20px;padding:10px 0;border-radius:3px}
  .h:nth-child(1){background:var(--b)} .h:nth-child(2){background:var(--i)} .h:nth-child(3){background:var(--n)}
  .h:nth-child(4){background:var(--g)} .h:nth-child(5){background:var(--o)}
  .cell{background:var(--cell);text-align:center;font-weight:700;font-size:23px;color:#333;height:58px;
        display:flex;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;user-select:none}
  .cell.m{background:var(--cellmark);color:var(--mark)}
  .cell.free{font-size:20px;cursor:default}
  .cardno{text-align:center;color:var(--title);font-weight:800;font-size:20px;margin:14px 0 10px}
  button{border:0;border-radius:12px;color:#fff;font-weight:800;font-size:21px;padding:0;height:66px;cursor:pointer;width:100%}
  button:active{transform:scale(.98)}
  .win{background:#f39c1b;margin-bottom:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .leave{background:#e8212f;height:62px} .refresh{background:#1565d8;height:62px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;
         border-radius:24px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>

<h1><span>🎱</span> Rodas Friend Zone Bingo</h1>

<div class="stats">
  <div class="stat"><small>Players</small><b id="players">1</b></div>
  <div class="stat"><small>Derash</small><b id="derash">0</b></div>
  <div class="stat"><small>Bet</small><b id="bet">10</b></div>
  <div class="stat"><small>Call</small><b id="callCount">0</b></div>
</div>

<div class="main">
  <div class="calls">
    <h3>BINGO CALLS</h3>
    <table>
      <thead><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr></thead>
      <tbody id="callsBody"></tbody>
    </table>
  </div>

  <div class="right">
    <div class="panel current"><h3>Current Call</h3><div class="ball" id="ball">–</div></div>
    <div class="panel last"><div id="lastCall">–</div></div>
    <div class="panel auto">Auto
      <label class="switch"><input type="checkbox" id="auto" checked><span></span></label>
    </div>
    <div class="panel card">
      <h3>Chosen Cartela</h3>
      <div class="grid" id="cardGrid"></div>
      <div class="cardno">Card Number: <span id="cardNo">35</span></div>
      <button class="win" id="winBtn">BINGO WIN</button>
      <div class="row">
        <button class="leave" id="leaveBtn">LEAVE</button>
        <button class="refresh" id="refreshBtn">REFRESH</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ---------- Telegram ---------- */
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#1e2836'); }

/* ---------- Config ---------- */
const API = "/api";        // set to "" for demo mode (no server needed)
const DEMO = !API;

/* ---------- State ---------- */
const COLS = ["B","I","N","G","O"];
const state = {
  card: [[15,21,42,50,67],[7,23,44,51,74],[2,30,0,56,65],[5,29,41,47,70],[12,24,43,49,72]], // 0 = FREE
  cardNo: 35, called: [], marked: new Set(), players: 1, derash: 0, bet: 10
};

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
const toast = msg => { const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); };

function buildCalls(){
  let h = "";
  for (let r=0;r<15;r++){
    h += "<tr>";
    for (let c=0;c<5;c++){ const n=c*15+r+1; h += `<td id="c${n}">${n}</td>`; }
    h += "</tr>";
  }
  $("callsBody").innerHTML = h;
}

function buildCard(){
  let h = COLS.map(l=>`<div class="h">${l}</div>`).join("");
  state.card.forEach((row,r)=>row.forEach((n,c)=>{
    if (n===0) h += `<div class="cell free m" data-free="1">FREE</div>`;
    else h += `<div class="cell${state.marked.has(n)?" m":""}" data-n="${n}">${n}</div>`;
  }));
  $("cardGrid").innerHTML = h;
  $("cardNo").textContent = state.cardNo;
}

function renderStats(){
  $("players").textContent = state.players;
  $("derash").textContent  = state.derash;
  $("bet").textContent     = state.bet;
  $("callCount").textContent = state.called.length;
}

/* ---------- Game logic ---------- */
function onCall(n){
  if (state.called.includes(n)) return;
  state.called.push(n);
  $("c"+n).classList.add("on");
  $("lastCall").textContent = n;
  $("ball").textContent = n;
  if ($("auto").checked && state.card.flat().includes(n)) state.marked.add(n);
  buildCard(); renderStats();
}

function hasBingo(){
  const m = (r,c) => state.card[r][c]===0 || state.marked.has(state.card[r][c]);
  const lines = [];
  for (let i=0;i<5;i++){
    lines.push([0,1,2,3,4].map(c=>[i,c]));
    lines.push([0,1,2,3,4].map(r=>[r,i]));
  }
  lines.push([0,1,2,3,4].map(i=>[i,i]));
  lines.push([0,1,2,3,4].map(i=>[i,4-i]));
  return lines.some(l=>l.every(([r,c])=>m(r,c)));
}

$("cardGrid").addEventListener("click", e=>{
  const el = e.target.closest(".cell"); if(!el || el.dataset.free) return;
  const n = +el.dataset.n;
  if ($("auto").checked) return toast("Turn Auto off to mark manually");
  if (!state.called.includes(n)) return toast("That number hasn't been called");
  state.marked.has(n) ? state.marked.delete(n) : state.marked.add(n);
  buildCard();
});

$("auto").addEventListener("change", ()=>{
  if ($("auto").checked){
    state.called.forEach(n=>{ if(state.card.flat().includes(n)) state.marked.add(n); });
    buildCard();
  }
});

$("winBtn").addEventListener("click", async ()=>{
  if (!hasBingo()) return toast("No bingo yet — keep playing");
  if (!DEMO){
    const r = await fetch(API+"/bingo", {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData: tg && tg.initData, cardNo: state.cardNo})}).then(r=>r.json()).catch(()=>null);
    return toast(r && r.ok ? "Bingo confirmed! 🎉" : "Bingo rejected");
  }
  toast("BINGO! 🎉");
});

$("leaveBtn").addEventListener("click", ()=>{
  if (!DEMO) fetch(API+"/leave",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData: tg && tg.initData})});
  tg ? tg.close() : toast("Left the game");
});

$("refreshBtn").addEventListener("click", ()=> DEMO ? toast("Refreshed") : sync());

/* ---------- Server sync ---------- */
async function sync(){
  try{
    const s = await fetch(API+"/state?card="+state.cardNo+"&initData="+encodeURIComponent((tg&&tg.initData)||"")).then(r=>r.json());
    Object.assign(state,{players:s.players,derash:s.derash,bet:s.bet});
    if (s.card) state.card = s.card;
    if (s.cardNo) state.cardNo = s.cardNo;
    buildCard(); renderStats();
    (s.called||[]).forEach(onCall);
  }catch(e){ toast("Connection problem"); }
}

/* ---------- Init ---------- */
buildCalls(); buildCard(); renderStats();

if (DEMO){
  const pool = Array.from({length:75},(_,i)=>i+1).sort(()=>Math.random()-.5);
  setInterval(()=>{ if(pool.length) onCall(pool.pop()); }, 4000);
} else {
  sync(); setInterval(sync, 3000);
}
</script>
</body>
</html>
