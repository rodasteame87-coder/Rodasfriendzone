<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Rodas Friend Zone Bingo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #c8f0f7;
    color: #222;
}

body {
    overflow-x: hidden;
}

button {
    font-family: inherit;
    border: none;
    outline: none;
    cursor: pointer;
}

button:disabled {
    cursor: default;
}

/* =========================================================
   TELEGRAM / TOP BAR
   ========================================================= */

.telegram-header {
    height: 64px;
    background: #17232f;
    color: white;
    display: grid;
    grid-template-columns: 62px 1fr 62px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 5px rgba(0,0,0,0.22);
}

.telegram-left {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 39px;
    font-weight: 200;
    line-height: 1;
}

.telegram-title {
    font-size: 25px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.telegram-right {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.telegram-chevron {
    font-size: 33px;
    line-height: 1;
    transform: translateY(-3px);
}

.telegram-menu {
    font-size: 32px;
    line-height: 1;
}

/* =========================================================
   APP
   ========================================================= */

#app {
    width: 100%;
    min-height: calc(100vh - 64px);
    background: #c8f0f7;
}

.screen {
    width: 100%;
    min-height: calc(100vh - 64px);
    padding: 12px 8px 24px;
}

/* =========================================================
   COMMON
   ========================================================= */

.hidden {
    display: none !important;
}

.card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.12);
}

/* =========================================================
   LOBBY
   ========================================================= */

.lobby-logo {
    text-align: center;
    color: #76227f;
    font-size: 29px;
    font-weight: 900;
    padding: 10px 5px 6px;
}

.lobby-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 12px;
}

.lobby-stat {
    background: #fffdf1;
    border-radius: 13px;
    padding: 8px 4px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
}

.lobby-stat-label {
    color: #76227f;
    font-size: 14px;
    font-weight: 900;
}

.lobby-stat-value {
    color: #111;
    font-size: 22px;
    font-weight: 900;
    margin-top: 2px;
}

.lobby-section-title {
    color: #76227f;
    font-size: 23px;
    font-weight: 900;
    text-align: center;
    margin: 15px 0 8px;
}

.game-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.game-row {
    background: white;
    border-radius: 15px;
    padding: 9px;
    display: grid;
    grid-template-columns: 72px 1fr 92px;
    gap: 8px;
    align-items: center;

}

.game-bet {
    background: #76227f;
    color: white;
    border-radius: 11px;
    min-height: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.game-bet strong {
    font-size: 25px;
}

.game-bet span {
    font-size: 11px;
    font-weight: 800;
}

.game-info {
    text-align: center;
}

.game-win {
    color: #159447;
    font-size: 21px;
    font-weight: 900;
}

.game-players {
    color: #76227f;
    font-size: 12px;
    font-weight: 800;
}

.game-status {
    background: #ece9ef;
    border-radius: 10px;
    text-align: center;
    padding: 8px 4px;
}

.game-status-text {
    color: #159447;
    font-size: 12px;
    font-weight: 900;
}

.join-button {

    background: #ff9d00;
    color: white;
    border-radius: 9px;
    min-height: 36px;
    margin-top: 5px;
    font-size: 15px;
    font-weight: 900;
}

.practice {
    background: white;
    border-radius: 15px;
    padding: 14px;
    margin-top: 14px;
    text-align: center;
}

.practice-title {
    color: #76227f;
    font-size: 20px;
    font-weight: 900;
}

.practice-subtitle {

    margin-top: 3px;
    font-size: 13px;
}

.practice-button {
    margin-top: 10px;
    background: #76227f;
    color: white;
    border-radius: 11px;

/* =========================================================
   CARTELA SELECTION

.selection-screen {

}

.selection-stats {

}

.selection-stat {

.selection-stat-label {
    color: #76227f;

}

.selection-stat-value {

/*
   Original selection header:

*/

.selection-header {

*/

.selection-actions {

.proceed-button,

.proceed-button {

}

.proceed-button:disabled {

.leave-button {

.call-board {

.call-board-title {

.current-call {

}

.current-call-label {

}

.last-call {

}

.player-card-wrapper {

.player-card-title {

<body>

<!-- =======================================================
     TELEGRAM HEADER
     ======================================================= -->

<div class="telegram-header">

    <div class="telegram-left">
        ×
    </div>

    <div class="telegram-title">
        Rodas Friend Zone
    </div>

    <div class="telegram-right">
        <span class="telegram-chevron">⌄</span>
        <span class="telegram-menu">⋮</span>
    </div>

</div>

<div id="app"></div>

<div id="wrongClaimOverlay" class="overlay hidden">
    <div class="overlay-box">
        <div class="overlay-title">
            Not Bingo Yet
        </div>

        <div class="overlay-text">
            Your selected numbers do not form a winning line yet.
        </div>

        <button
            class="overlay-button"
            onclick="closeWrongClaim()"
        >
            OK
        </button>
    </div>
</div>

<script>

/* =========================================================
   TELEGRAM
   ========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {
    try {
        tg.ready();
        tg.expand();
    } catch (error) {
        console.log(error);
    }
}

/* =========================================================
   USER ID
   ========================================================= */

function getUserId() {

    let id = null;

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.id
    ) {
        id = String(tg.initDataUnsafe.user.id);
    }

    if (!id) {
        id = localStorage.getItem("rfz_user_id");
    }

    if (!id) {
        id =
            "web_" +
            Math.random().toString(36).slice(2) +
            "_" +
            Date.now();

        localStorage.setItem("rfz_user_id", id);
    }

    return id;
}

const USER_ID = getUserId();

/* =========================================================
   STATE
   ========================================================= */

let state = null;

let selectedCartela = null;

let proceeded = false;

let autoMode = true;

let manuallyMarked = new Set();

let returnedToSelection = false;

let inLobby = true;

let pollingTimer = null;

/* =========================================================
   API
   ========================================================= */

async function api(
    path,
    options = {}
) {

    const config = {
        ...options,
        headers: {
            "Content-Type": "application/json",
            "X-User-ID": USER_ID,
            ...(options.headers || {})
        }
    };

    const response = await fetch(
        path,
        config
    );

    let data = null;

    try {
        data = await response.json();
    } catch (error) {
        data = null;
    }

    if (!response.ok) {

        const message =
            data &&
            (
                data.error ||
                data.message
            )
                ? (
                    data.error ||
                    data.message
                )
                : "Request failed";

        throw new Error(message);
    }

    return data;
}

/* =========================================================
   HELPERS
   ========================================================= */

function numberValue(value, fallback = 0) {

    const number = Number(value);

    return Number.isFinite(number)
        ? number
        : fallback;
}

function getPhase() {

    if (!state) {
        return "";
    }

    return String(
        state.phase ||
        state.status ||
        ""
    ).toLowerCase();
}

function getPlayerCount() {

    if (!state) {
        return 0;
    }

    return numberValue(
        state.players_count ??
        state.player_count ??
        state.players ??
        (
            Array.isArray(state.player_list)
                ? state.player_list.length
                : 0
        ),
        0
    );
}

function getWallet() {

    if (!state) {
        return 1000;
    }

    return numberValue(
        state.wallet ??
        state.balance ??
        state.player_balance ??
        1000,
        1000
    );
}

function getBet() {

    if (!state) {
        return 10;
    }

    return numberValue(
        state.bet ??
        state.entry_fee ??
        10,
        10
    );
}

function getDerash() {

    if (!state) {
        return 0;
    }

    return numberValue(
        state.derash ??
        state.prize ??
        state.payout ??
        0,
        0
    );
}

function getGameNumber() {

    if (!state) {
        return "";
    }

    return (
        state.game_number ??
        state.game ??
        state.number ??
        ""
    );
}

function getRemainingSeconds() {

    if (!state) {
        return 0;
    }

    const direct =
        state.remaining_seconds ??
        state.countdown ??
        state.seconds_remaining;

    if (
        direct !== undefined &&
        direct !== null
    ) {
        return Math.max(
            0,
            Math.ceil(numberValue(direct, 0))
        );
    }

    const deadline =
        state.selection_end ??
        state.start_end ??
        state.end_time ??
        state.deadline;

    if (deadline) {

        let timestamp =
            typeof deadline === "number"
                ? deadline
                : Date.parse(deadline);

        if (
            Number.isFinite(timestamp) &&
            timestamp < 10000000000
        ) {
            timestamp *= 1000;
        }

        if (Number.isFinite(timestamp)) {
            return Math.max(
                0,
                Math.ceil(
                    (timestamp - Date.now()) / 1000
                )
            );
        }
    }

    return 0;
}

function getTakenCartelas() {

    if (!state) {
        return [];
    }

    let source =
        state.taken_cartelas ??
        state.taken ??
        state.used_cartelas ??
        state.occupied_cartelas ??
        [];

    if (
        source &&
        !Array.isArray(source) &&
        typeof source === "object"
    ) {
        source = Object.keys(source);
    }

    if (!Array.isArray(source)) {
        return [];
    }

    return source
        .map(value => Number(value))
        .filter(
            value =>
                Number.isInteger(value) &&
                value >= 1 &&
                value <= 100
        );
}

function getMyCartela() {

    if (!state) {
        return selectedCartela;
    }

    const value =
        state.my_cartela ??
        state.player_cartela ??
        state.cartela ??
        state.selected_cartela ??
        selectedCartela;

    const number = Number(value);

    if (
        Number.isInteger(number) &&
        number >= 1 &&
        number <= 100
    ) {
        return number;
    }

    return selectedCartela;
}

function getCalledNumbers() {

    if (!state) {
        return [];
    }

    const source =
        state.called_numbers ??
        state.called ??
        state.calls ??
        state.drawn_numbers ??
        [];

    if (!Array.isArray(source)) {
        return [];
    }

    return source
        .map(value => Number(value))
        .filter(
            value =>
                Number.isInteger(value) &&
                value >= 1 &&
                value <= 75
        );
}

function getCurrentCall() {

    if (!state) {
        return null;
    }

    const value =
        state.current_call ??
        state.current_number ??
        state.last_called ??
        state.last_call ??
        null;

    const number = Number(value);

    return Number.isInteger(number)
        ? number
        : null;
}

function getLastCall() {

    if (!state) {
        return null;
    }

    const value =
        state.last_call ??
        state.last_called ??
        state.previous_call ??
        null;

    const number = Number(value);

    return Number.isInteger(number)
        ? number
        : null;
}

/* =========================================================
   LOAD STATE
   ========================================================= */

async function loadState(
    renderNow = true
) {

    try {

        const data =
            await api("/api/state");

        state = data;

        const serverCartela =
            getMyCartela();

        if (
            serverCartela &&
            !returnedToSelection
        ) {
            selectedCartela =
                serverCartela;
        }

        if (
            returnedToSelection
        ) {

            if (renderNow) {
                renderSelection();
            }

            return;
        }

        if (renderNow) {
            render();
        }

    } catch (error) {

        console.error(
            "State error:",
            error
        );
    }
}

/* =========================================================
   RENDER ROUTER
   ========================================================= */

function render() {

    if (returnedToSelection) {
        renderSelection();
        return;
    }

    const phase = getPhase();

    if (
        phase === "finished" ||
        phase === "result" ||
        phase === "completed"
    ) {
        renderResult();
        return;
    }

    if (
        phase === "selection" &&
        !proceeded
    ) {
        renderSelection();
        return;
    }

    if (
        phase === "selection" &&
        !selectedCartela
    ) {
        renderSelection();
        return;
    }

    if (
        phase === "starting" ||
        phase === "playing" ||
        phase === "game"
    ) {
        renderGame();
        return;
    }

    if (
        state &&
        (
            state.player_cartela ||
            state.my_cartela
        ) &&
        proceeded
    ) {
        renderGame();
        return;
    }

    if (inLobby) {
        renderLobby();
        return;
    }

    renderSelection();
}

   ========================================================= */

function renderCartelas() {

    const grid =
        document.getElementById("cartelaGrid");

    if (!grid) {
        return;
    }

    grid.innerHTML = "";

    const taken =
        getTakenCartelas();

    const current =
        selectedCartela ||
        getMyCartela();

    for (
        let number = 1;
        number <= 100;
        number++
    ) {

        const button =
            document.createElement("button");

        button.className =
            "cartela-button";

        button.textContent =
            number;

        const isTaken =
            taken.includes(number);

        const isSelected =
            Number(current) === number;

        if (isTaken) {
            button.classList.add("taken");
        }

        if (isSelected) {
            button.classList.add("selected");
        }

        /*
         * A cartela taken by another player cannot be selected.
         * The player's own current cartela remains selectable.
         */

        if (
            isTaken &&
            !isSelected
        ) {
            button.disabled = true;
        }

        button.onclick =
            () => selectCartela(number);

        grid.appendChild(button);
    }
}

/* =========================================================
   SELECT CARTELA
   ========================================================= */

async function selectCartela(number) {

    if (
        !Number.isInteger(number) ||
        number < 1 ||
        number > 100
    ) {
        return;
    }

    try {

        const data =
            await api(
                "/api/select",
                {
                    method: "POST",
                    body: JSON.stringify({
                        cartela: number,
                        cartela_number: number
                    })
                }
            );

        selectedCartela =
            number;

        proceeded = false;

        returnedToSelection = false;

        if (data) {
            state = data;
        }

        renderSelection();

    } catch (error) {

        console.error(
            "Cartela selection error:",
            error
        );

        alert(
            error.message ||
            "That cartela is not available."
        );
    }
}

/* =========================================================
   PROCEED
   ========================================================= */

async function proceedGame() {

    const cartela =
        selectedCartela ||
        getMyCartela();

    if (!cartela) {

        alert(
            "Please select a cartela first."
        );

        return;
    }

    try {

        returnedToSelection = false;

        const data =
            await api(
                "/api/proceed",
                {
                    method: "POST",
                    body: JSON.stringify({
                        cartela: Number(cartela),
                        cartela_number: Number(cartela)
                    })
                }
            );

        proceeded = true;

        if (data) {
            state = data;
        }

        await loadState(false);

        render();

    } catch (error) {

        console.error(
            "Proceed error:",
            error
        );

        alert(
            error.message ||
            "Unable to proceed."
        );
    }
}

/* =========================================================
   LEAVE
   =========================================================
   IMPORTANT:
   Player leaves only themselves.
   Other players/game continue.
   Player is returned to Cartela Selection.
   ========================================================= */

async function leaveGame() {

    try {

        /*
         * Set this BEFORE the API request so polling
         * cannot immediately send the player back
         * into the Bingo Game.
         */

        returnedToSelection = true;

        proceeded = false;

        selectedCartela = null;

        manuallyMarked.clear();

        await api(
            "/api/leave",
            {
                method: "POST",
                body: JSON.stringify({})
            }
        );

        await loadState(false);

        /*
         * Always return this player to selection.
         */

        renderSelection();

    } catch (error) {

        /*
         * Even if the server request has an error,
         * keep the player on the selection screen.
         */

        returnedToSelection = true;

        proceeded = false;

        selectedCartela = null;

        manuallyMarked.clear();

        renderSelection();

        console.error(
            "Leave error:",
            error
        );
    }
}

/* =========================================================
   GET PLAYER CARD DATA
   ========================================================= */

function getPlayerCardNumbers() {

    if (!state) {
        return [];
    }

    let card =
        state.player_card ??
        state.cartela_numbers ??
        state.cartela_grid ??
        state.bingo_card ??
        state.card ??
        null;

    /*
     * Some backends may return the player's card
     * as a 2D array.
     */

    if (Array.isArray(card)) {

        if (
            card.length === 5 &&
            Array.isArray(card[0])
        ) {
            return card.flat();
        }

        if (card.length >= 25) {
            return card.slice(0, 25);
        }
    }

    /*
     * Try nested player object.
     */

    const player =
        state.player ??
        state.me ??
        state.current_player ??
        null;

    if (player) {

        card =
            player.card ??
            player.cartela ??
            player.bingo_card ??
            player.numbers ??
            null;

        if (Array.isArray(card)) {

            if (
                card.length === 5 &&
                Array.isArray(card[0])
            ) {
                return card.flat();
            }

            if (card.length >= 25) {
                return card.slice(0, 25);
            }
        }
    }

    return [];
}

/* =========================================================
   PLAYER CARD
   ========================================================= */

function renderPlayerCard() {

    const container =
        document.getElementById("playerCard");

    if (!container) {
        return;
    }

    const numbers =
        getPlayerCardNumbers();

    const called =
        new Set(
            getCalledNumbers()
        );

    container.innerHTML = `

        <div class="bingo-head">

            <div>B</div>
            <div>I</div>
            <div>N</div>
            <div>G</div>
            <div>O</div>

        </div>

        <div
            class="bingo-grid"
            id="bingoGrid"
        ></div>
    `;

    const grid =
        document.getElementById(
            "bingoGrid"
        );

    /*
     * If backend has not supplied a card yet,
     * show an empty 5x5 board rather than inventing
     * numbers that could cause an incorrect Bingo.
     */

    const values =
        numbers.length >= 25
            ? numbers
            : new Array(25).fill("");

    values.forEach(
        (value, index) => {

            const cell =
                document.createElement("div");

            cell.className =
                "bingo-cell";

            const isCenter =
                index === 12;

            const numericValue =
                Number(value);

            if (isCenter) {

                cell.classList.add("free");

                cell.textContent =
                    "FREE";

            } else {

                cell.textContent =
                    value !== null &&
                    value !== undefined
                        ? value
                        : "";

                if (
                    Number.isInteger(numericValue) &&
                    called.has(numericValue)
                ) {
                    cell.classList.add(
                        "called"
                    );
                }

                if (
                    manuallyMarked.has(index)
                ) {
                    cell.classList.add(
                        "manual"
                    );
                }

                cell.onclick =
                    () => toggleManualMark(index);
            }

            grid.appendChild(cell);
        }
    );
}

/* =========================================================
   MANUAL MARK
   ========================================================= */

function toggleManualMark(index) {

    if (manuallyMarked.has(index)) {
        manuallyMarked.delete(index);
    } else {
        manuallyMarked.add(index);
    }

    renderPlayerCard();
}

            "gameCountdown"
        );

    if (!element) {
        return;
    }

    const seconds =
        getRemainingSeconds();

    element.textContent =
        seconds + " sec";
}

/* =========================================================
   RESULT
   ========================================================= */

function renderResult() {

    const app =
        document.getElementById("app");

    const winner =
        state &&
        (
            state.winner_name ??
            state.winner ??
            state.winner_username ??
            "Winner"
        );

    const prize =
        getDerash();

    app.innerHTML = `

        <div class="screen result-screen">

            <div class="result-box">

                <div class="result-title">
                    🎉 BINGO RESULT
                </div>

                <div class="result-winner">
                    ${escapeHtml(String(winner))}
                    has won the game!
                </div>

                <div class="result-prize">
                    Derash: ${prize} BIRR
                </div>

                <div
                    class="player-card-wrapper result-card"
                >

                    <div class="player-card-title">
                        Your Cartela
                    </div>

                    <div
                        class="bingo-card"
                        id="resultCard"
                    ></div>

                </div>

                <button
                    class="proceed-button"
                    style="width:100%;margin-top:12px;"
                    onclick="backToLobby()"
                >
                    BACK TO LOBBY
                </button>

            </div>

        </div>

    `;

    renderResultCard();
}

/* =========================================================
   RESULT CARD
   ========================================================= */

function renderResultCard() {

    const container =
        document.getElementById(
            "resultCard"
        );

    if (!container) {
        return;
    }

    const numbers =
        getPlayerCardNumbers();

    const called =
        new Set(
            getCalledNumbers()
        );

    const values =
        numbers.length >= 25
            ? numbers
            : new Array(25).fill("");

    container.innerHTML = `

        <div class="bingo-head">

            <div>B</div>
            <div>I</div>
            <div>N</div>
            <div>G</div>
            <div>O</div>

        </div>

        <div
            class="bingo-grid"
            id="resultBingoGrid"
        ></div>
    `;

    const grid =
        document.getElementById(
            "resultBingoGrid"
        );

    values.forEach(
        (value, index) => {

            const cell =
                document.createElement("div");

            cell.className =
                "bingo-cell";

            if (index === 12) {

                cell.classList.add(
                    "free"
                );

                cell.textContent =
                    "FREE";

            } else {

                cell.textContent =
                    value ?? "";

                const number =
                    Number(value);

                if (
                    Number.isInteger(number) &&
                    called.has(number)
                ) {
                    cell.classList.add(
                        "called"
                    );
                }
            }

            grid.appendChild(cell);
        }
    );
}

/* =========================================================
   BACK TO LOBBY
   ========================================================= */

function backToLobby() {

    state = null;

    selectedCartela = null;

    proceeded = false;

    manuallyMarked.clear();

    returnedToSelection = false;

    inLobby = true;

    renderLobby();
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

function renderBottomNav(active) {

    return `

        <div class="bottom-nav">

            <div
                class="bottom-item ${
                    active === "game"
                        ? "active"
                        : ""
                }"
                onclick="backToLobby()"
            >

                <div class="bottom-icon">
                    🎮
                </div>

                Game

            </div>

            <div class="bottom-item">

                <div class="bottom-icon">
                    🏆
                </div>

                Scores

            </div>

            <div class="bottom-item">

                <div class="bottom-icon">
                    👤
                </div>

                Profile

            </div>

        </div>
    `;
}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================================================
   POLLING
   ========================================================= */

async function pollState() {

    try {

        const data =
            await api("/api/state");

        state = data;

        /*
         * If player explicitly pressed LEAVE,
         * polling must never put them back into
         * the Bingo Game.
         */

        if (returnedToSelection) {
            renderSelection();
            return;
        }

        /*
         * Keep the selected cartela synchronized.
         */

        const serverCartela =
            getMyCartela();

        if (serverCartela) {
            selectedCartela =
                serverCartela;
        }

        render();

    } catch (error) {

        console.error(
            "Polling error:",
            error
        );
    }
}

/* =========================================================
   START POLLING
   ========================================================= */

function startPolling() {

    if (pollingTimer) {
        clearInterval(
            pollingTimer
        );
    }

    pollingTimer =
        setInterval(
            pollState,
            1000
        );
}

/* =========================================================
   LOCAL COUNTDOWN REFRESH
   ========================================================= */

setInterval(
    () => {

        if (
            document.getElementById(
                "selectionCountdown"
            )
        ) {
            updateSelectionCountdown();
        }

        if (
            document.getElementById(
                "gameCountdown"
            )
        ) {
            updateGameCountdown();
        }

        const topTime =
            document.getElementById(
                "topSelectionTime"
            );

        if (topTime) {
            topTime.textContent =
                getRemainingSeconds();
        }

    },
    250
);

/* =========================================================
   START
   ========================================================= */

async function startApp() {

    try {

        await loadState(false);

        /*
         * If there is already an active game,
         * load it. Otherwise show lobby.
         */

        if (state) {

            const phase =
                getPhase();

            if (
                phase === "selection" &&
                !returnedToSelection
            ) {
                inLobby = false;
                renderSelection();

            } else if (
                phase === "starting" ||
                phase === "playing" ||
                phase === "game"
            ) {
                inLobby = false;

                if (
                    getMyCartela()
                ) {
                    selectedCartela =
                        getMyCartela();
                }

                proceeded = true;

                renderGame();

            } else if (
                phase === "finished" ||
                phase === "result" ||
                phase === "completed"
            ) {
                inLobby = false;
                renderResult();

            } else {
                inLobby = true;
                renderLobby();
            }

        } else {

            inLobby = true;

            renderLobby();
        }

    } catch (error) {

        console.error(
            "Startup error:",
            error
        );

        inLobby = true;

        renderLobby();
    }

    startPolling();
}

startApp();

</script>

</body>
</html>
