<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Rodas Friend Zone</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 12px;
            background: #dff4ff;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* =========================
           TOP STATUS BAR
        ========================= */

        .status-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .status-pill {
            background: white;
            border-radius: 18px;
            padding: 8px 4px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(80, 120, 160, 0.12);
        }

        .status-label {
            font-size: 11px;
            font-weight: 700;
            color: #777;
            margin-bottom: 2px;
        }

        .status-value {
            font-size: 18px;
            font-weight: 900;
            color: #5428a8;
        }

        /* =========================
           SCREENS
        ========================= */

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* =========================
           SELECTION SCREEN
        ========================= */

        .selection-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 5px 18px rgba(80, 120, 160, 0.15);
        }

        .selection-title {
            text-align: center;
            font-size: 25px;
            font-weight: 900;
            color: #5428a8;
            margin: 2px 0 18px;
        }

        .selection-subtitle {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-bottom: 18px;
        }

        .cartela-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 58vh;
            overflow-y: auto;
            padding: 3px;
        }

        .cartela-btn {
            border: none;
            background: #f3edff;
            color: #5428a8;
            border-radius: 12px;
            min-height: 44px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
        }

        .cartela-btn.selected {
            background: #5428a8;
            color: white;
            transform: scale(1.03);
        }

        .proceed-btn {
            width: 100%;
            margin-top: 18px;
            border: none;
            border-radius: 17px;
            padding: 15px;
            background: #5428a8;
            color: white;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
        }

        .proceed-btn:disabled {
            background: #bdb6ca;
            cursor: not-allowed;
        }

        .selection-message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #777;
            min-height: 18px;
        }

        /* =========================
           GAME LAYOUT
        ========================= */

        .game-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.9fr);
            gap: 12px;
            align-items: start;
        }

        .game-panel {
            background: white;
            border-radius: 22px;
            padding: 12px;
            box-shadow: 0 5px 18px rgba(80, 120, 160, 0.13);
        }

        .panel-title {
            text-align: center;
            color: #5428a8;
            font-weight: 900;
            font-size: 17px;
            margin-bottom: 10px;
        }

        /* =========================
           BINGO NUMBER BOARD
        ========================= */

        .number-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .number-header {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            font-size: 17px;
            font-weight: 900;
            color: white;
        }

        .number-header.b {
            background: #23a65a;
        }

        .number-header.i {
            background: #f39b23;
        }

        .number-header.n {
            background: #3584e4;
        }

        .number-header.g {
            background: #e44848;
        }

        .number-header.o {
            background: #7c45b8;
        }

        .number-cell {
            min-height: 34px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2effa;
            border-radius: 8px;
            color: #a49bc0;
            font-size: 13px;
            font-weight: 800;
            transition: 0.15s;
        }

        .number-cell.called {
            background: #36c76c;
            color: white;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45);
        }

        .number-cell.current {
            background: #ff9f2f;
            color: white;
            transform: scale(1.05);
        }

        /* =========================
           CURRENT CALL
        ========================= */

        .current-call {
            background: #5428a8;
            border-radius: 18px;
            padding: 12px;
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .current-call-label {
            font-size: 12px;
            font-weight: 800;
            opacity: 0.85;
            margin-bottom: 7px;
        }

        .call-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .call-ball {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #ff9f2f;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 23px;
            font-weight: 900;
        }

        .call-number {
            font-size: 27px;
            font-weight: 900;
        }

        /* =========================
           EMPTY WHITE BOX
        ========================= */

        .empty-call-box {
            height: 72px;
            background: white;
            border-radius: 18px;
            border: 2px solid #e9e6f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .empty-circle {
            width: 39px;
            height: 39px;
            border-radius: 50%;
            background: #438de4;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
        }

        /* =========================
           AUTO SWITCH
        ========================= */

        .auto-row {
            background: white;
            border-radius: 16px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border: 2px solid #eeeaf5;
        }

        .auto-text {
            font-weight: 900;
            color: #5428a8;
        }

        .auto-description {
            font-size: 10px;
            color: #888;
            margin-top: 2px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 27px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #c9c9c9;
            border-radius: 30px;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 21px;
            height: 21px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        input:checked + .slider {
            background: #5428a8;
        }

        input:checked + .slider:before {
            transform: translateX(21px);
        }

        /* =========================
           PLAYER CARD
        ========================= */

        .player-card {
            background: white;
            border-radius: 18px;
            padding: 10px;
            border: 2px solid #eeeaf5;
        }

        .player-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .player-header {
            height: 29px;
            border-radius: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 13px;
            font-weight: 900;
        }

        .player-header.b {
            background: #247be0;
        }

        .player-header.i {
            background: #df4141;
        }

        .player-header.n {
            background: #25a75b;
        }

        .player-header.g {
            background: #f08a24;
        }

        .player-header.o {
            background: #df4141;
        }

        .player-cell {
            min-height: 39px;
            border-radius: 8px;
            background: #f2effa;
            color: #514a67;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
        }

        .player-cell.called {
            background: #39c96b;
            color: white;
        }

        .player-cell.free {
            background: #25c96b;
            color: white;
        }

        .player-cell.winning {
            background: #ff9f2f;
            color: white;
            box-shadow: 0 0 0 2px #5428a8;
        }

        .manual-hint {
            text-align: center;
            color: #777;
            font-size: 11px;
            margin: 8px 0;
        }

        .bingo-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 14px;
            background: #5428a8;
            color: white;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
        }

        .bingo-btn:disabled {
            background: #b9b3c3;
        }

        /* =========================
           MESSAGES
        ========================= */

        .game-message {
            margin-top: 9px;
            min-height: 20px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
        }

        .game-message.success {
            color: #15964b;
        }

        .game-message.error {
            color: #d63d3d;
        }

        /* =========================
           RESULT SCREEN
        ========================= */

        .result-card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 6px 22px rgba(80, 120, 160, 0.16);
            text-align: center;
        }

        .winner-icon {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #ffd15c;
            margin: 0 auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
        }

        .winner-title {
            color: #5428a8;
            font-size: 28px;
            font-weight: 900;
            margin: 4px 0;
        }

        .winner-name {
            font-size: 20px;
            font-weight: 900;
            color: #222;
            margin-bottom: 5px;
        }

        .winner-pattern {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .result-board-wrap {
            max-width: 430px;
            margin: 0 auto;
            background: #f8f6fc;
            padding: 10px;
            border-radius: 18px;
        }

        .result-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .result-cell {
            min-height: 42px;
            border-radius: 8px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: 900;
            color: #5b5570;
        }

        .result-cell.free {
            background: #25c96b;
            color: white;
        }

        .result-cell.winner-cell {
            background: #ff9f2f;
            color: white;
            box-shadow: 0 0 0 2px #5428a8;
        }

        .result-prize {
            margin-top: 15px;
            background: #5428a8;
            color: white;
            border-radius: 16px;
            padding: 12px;
            font-size: 18px;
            font-weight: 900;
        }

        .result-info {
            color: #777;
            font-size: 12px;
            margin-top: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 760px) {
            body {
                padding: 8px;
            }

            .game-layout {
                grid-template-columns: 1fr;
            }

            .status-bar {
                gap: 5px;
            }

            .status-pill {
                border-radius: 14px;
                padding: 7px 2px;
            }

            .status-value {
                font-size: 16px;
            }

            .number-cell {
                min-height: 31px;
                font-size: 12px;
            }

            .number-header {
                height: 32px;
                font-size: 15px;
            }

            .player-cell {
                min-height: 43px;
            }

            .game-panel {
                padding: 10px;
            }
        }

        @media (max-width: 390px) {
            .status-label {
                font-size: 9px;
            }

            .status-value {
                font-size: 14px;
            }

            .player-cell {
                min-height: 39px;
                font-size: 11px;
            }

            .number-cell {
                min-height: 29px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         TOP STATUS BAR
    ========================== -->

    <div class="status-bar">

        <div class="status-pill">
            <div class="status-label">PLAYERS</div>
            <div class="status-value" id="playersValue">0</div>
        </div>

        <div class="status-pill">
            <div class="status-label">DERASH</div>
            <div class="status-value" id="derashValue">0</div>
        </div>

        <div class="status-pill">
            <div class="status-label">BET</div>
            <div class="status-value" id="betValue">10</div>
        </div>

        <div class="status-pill">
            <div class="status-label">CALL</div>
            <div class="status-value" id="callValue">0</div>
        </div>

    </div>


    <!-- =========================
         SELECTION SCREEN
    ========================== -->

    <div id="selectionScreen" class="screen">

        <div class="selection-card">

            <div class="selection-title">
                CHOOSE YOUR CARTELA
            </div>

            <div class="selection-subtitle">
                Select a cartela from 1 to 100
            </div>

            <div id="cartelaGrid" class="cartela-grid"></div>

            <button
                id="proceedButton"
                class="proceed-btn"
                disabled
                onclick="proceedGame()"
            >
                PROCEED
            </button>

            <div id="selectionMessage" class="selection-message"></div>

        </div>

    </div>


    <!-- =========================
         GAME SCREEN
    ========================== -->

    <div id="gameScreen" class="screen">

        <div class="game-layout">

            <!-- LEFT: NUMBER BOARD -->

            <div class="game-panel">

                <div class="panel-title">
                    BINGO NUMBERS
                </div>

                <div id="numberBoard" class="number-board"></div>

            </div>


            <!-- RIGHT: CONTROLS + PLAYER CARD -->

            <div class="game-panel">

                <div class="current-call">

                    <div class="current-call-label">
                        CURRENT CALL
                    </div>

                    <div class="call-display">

                        <div class="call-ball">
                            <span id="currentCallBall">—</span>
                        </div>

                        <div class="call-number" id="currentCallNumber">
                            —
                        </div>

                    </div>

                </div>


                <div class="empty-call-box">
                    <div class="empty-circle">—</div>
                </div>


                <div class="auto-row">

                    <div>
                        <div class="auto-text">AUTO</div>
                        <div class="auto-description">
                            Automatically mark and claim
                        </div>
                    </div>

                    <label class="switch">
                        <input
                            type="checkbox"
                            id="autoToggle"
                            onchange="changeAutoMode()"
                        >
                        <span class="slider"></span>
                    </label>

                </div>


                <div class="player-card">

                    <div id="playerBoard" class="player-board"></div>

                    <div id="manualHint" class="manual-hint">
                        Auto is ON
                    </div>

                    <button
                        id="bingoButton"
                        class="bingo-btn"
                        onclick="claimBingo()"
                    >
                        BINGO WIN
                    </button>

                    <div id="gameMessage" class="game-message"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         RESULT SCREEN
    ========================== -->

    <div id="resultScreen" class="screen">

        <div class="result-card">

            <div class="winner-icon">
                🏆
            </div>

            <div class="winner-title">
                BINGO!
            </div>

            <div id="winnerName" class="winner-name">
                Winner
            </div>

            <div id="winnerPattern" class="winner-pattern">
                Winner pattern
            </div>

            <div class="result-board-wrap">

                <div id="resultBoard" class="result-board"></div>

            </div>

            <div id="winnerPrize" class="result-prize">
                Derash: 0
            </div>

            <div class="result-info">
                New game will start after 30 seconds.
            </div>

        </div>

    </div>

</div>


<script>
    /* =========================================================
       TELEGRAM
    ========================================================= */

    const tg = window.Telegram && window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

    if (tg) {
        tg.ready();
        tg.expand();
    }


    /* =========================================================
       USER INFORMATION
    ========================================================= */

    let telegramUser = null;

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        telegramUser = tg.initDataUnsafe.user;
    }

    const USER_ID =
        telegramUser && telegramUser.id
            ? String(telegramUser.id)
            : "guest";

    const USER_NAME =
        telegramUser && telegramUser.first_name
            ? telegramUser.first_name
            : "Player";


    /* =========================================================
       GAME VARIABLES
    ========================================================= */

    let selectedCartela = null;
    let latestState = null;
    let pollTimer = null;

    let manuallyMarked = new Set();

    let previousPhase = null;


    /* =========================================================
       API
    ========================================================= */

    async function api(url, options = {}) {

        const headers = {
            "Content-Type": "application/json",
            "X-User-ID": USER_ID,
            "X-User-Name": USER_NAME,
            ...(options.headers || {})
        };

        try {

            const response = await fetch(url, {
                ...options,
                headers
            });

            let data = {};

            try {
                data = await response.json();
            } catch (e) {
                data = {};
            }

            return {
                ok: response.ok,
                status: response.status,
                data
            };

        } catch (error) {

            console.error("API error:", error);

            return {
                ok: false,
                status: 0,
                data: {
                    success: false,
                    message: "Connection error"
                }
            };
        }
    }


    /* =========================================================
       SCREENS
    ========================================================= */

    function showScreen(name) {

        document
            .querySelectorAll(".screen")
            .forEach(screen => screen.classList.remove("active"));

        const screen = document.getElementById(name);

        if (screen) {
            screen.classList.add("active");
        }
    }


    /* =========================================================
       CARTELA SELECTION
    ========================================================= */

    function createCartelaButtons() {

        const grid = document.getElementById("cartelaGrid");

        grid.innerHTML = "";

        for (let i = 1; i <= 100; i++) {

            const button = document.createElement("button");

            button.className = "cartela-btn";
            button.textContent = i;

            button.onclick = () => selectCartela(i, button);

            grid.appendChild(button);
        }
    }


    async function selectCartela(number, button) {

        selectedCartela = number;

        document
            .querySelectorAll(".cartela-btn")
            .forEach(btn => btn.classList.remove("selected"));

        button.classList.add("selected");

        document.getElementById("proceedButton").disabled = false;

        const message =
            document.getElementById("selectionMessage");

        message.textContent = "Selecting cartela...";

        const result = await api("/api/select", {
            method: "POST",
            body: JSON.stringify({
                cartela: number,
                name: USER_NAME
            })
        });

        if (result.ok && result.data.success !== false) {

            message.textContent =
                "Cartela " + number + " selected.";

        } else {

            message.textContent =
                result.data.message || "Could not select cartela.";

            selectedCartela = null;

            document
                .querySelectorAll(".cartela-btn")
                .forEach(btn => btn.classList.remove("selected"));

            document.getElementById("proceedButton").disabled = true;
        }
    }


    async function proceedGame() {

        if (!selectedCartela) {
            return;
        }

        const button =
            document.getElementById("proceedButton");

        button.disabled = true;
        button.textContent = "PLEASE WAIT...";

        const result = await api("/api/proceed", {
            method: "POST",
            body: JSON.stringify({
                cartela: selectedCartela,
                name: USER_NAME
            })
        });

        if (!result.ok || result.data.success === false) {

            document.getElementById("selectionMessage").textContent =
                result.data.message || "Unable to start.";

            button.disabled = false;
            button.textContent = "PROCEED";

            return;
        }

        showScreen("gameScreen");

        startPolling();
    }


    /* =========================================================
       BUILD NUMBER BOARD
    ========================================================= */

    function buildNumberBoard() {

        const board =
            document.getElementById("numberBoard");

        board.innerHTML = "";

        const letters = [
            ["B", "b"],
            ["I", "i"],
            ["N", "n"],
            ["G", "g"],
            ["O", "o"]
        ];

        letters.forEach(letter => {

            const header =
                document.createElement("div");

            header.className =
                "number-header " + letter[1];

            header.textContent =
                letter[0];

            board.appendChild(header);
        });

        /*
         * The grid is column based:
         *
         * B = 1-15
         * I = 16-30
         * N = 31-45
         * G = 46-60
         * O = 61-75
         */

        for (let row = 0; row < 15; row++) {

            for (let col = 0; col < 5; col++) {

                const number =
                    col * 15 + row + 1;

                const cell =
                    document.createElement("div");

                cell.className = "number-cell";
                cell.dataset.number = number;
                cell.textContent = number;

                board.appendChild(cell);
            }
        }
    }


    /* =========================================================
       BUILD PLAYER BOARD
    ========================================================= */

    function buildPlayerBoard(boardData, calledNumbers, winningCells) {

        const board =
            document.getElementById("playerBoard");

        board.innerHTML = "";

        if (!boardData || !Array.isArray(boardData)) {
            return;
        }

        const headers = [
            ["B", "b"],
            ["I", "i"],
            ["N", "n"],
            ["G", "g"],
            ["O", "o"]
        ];

        headers.forEach(headerData => {

            const cell =
                document.createElement("div");

            cell.className =
                "player-header " + headerData[1];

            cell.textContent =
                headerData[0];

            board.appendChild(cell);
        });


        const calledSet =
            new Set((calledNumbers || []).map(Number));

        const winningSet =
            new Set(
                (winningCells || []).map(
                    item => Array.isArray(item)
                        ? item.join(",")
                        : String(item)
                )
            );


        for (let row = 0; row < 5; row++) {

            for (let col = 0; col < 5; col++) {

                const value =
                    boardData[row][col];

                const cell =
                    document.createElement("div");

                cell.className = "player-cell";

                cell.dataset.row = row;
                cell.dataset.col = col;

                if (value === "FREE") {

                    cell.classList.add("free");

                } else {

                    const number =
                        Number(value);

                    cell.textContent =
                        number;

                    /*
                     * Auto mode:
                     * called numbers are automatically green.
                     *
                     * Manual mode:
                     * only numbers touched by the player
                     * are green.
                     */

                    const autoEnabled =
                        document.getElementById("autoToggle").checked;

                    if (autoEnabled) {

                        if (calledSet.has(number)) {
                            cell.classList.add("called");
                        }

                    } else {

                        if (manuallyMarked.has(number)) {
                            cell.classList.add("called");
                        }
                    }
                }

                const key =
                    row + "," + col;

                if (winningSet.has(key)) {
                    cell.classList.add("winning");
                }

                cell.onclick = () =>
                    touchPlayerNumber(row, col, value);

                board.appendChild(cell);
            }
        }
    }


    /* =========================================================
       MANUAL NUMBER TOUCH
    ========================================================= */

    function touchPlayerNumber(row, col, value) {

        if (!latestState) {
            return;
        }

        if (latestState.phase !== "playing") {
            return;
        }

        if (latestState.disqualified) {
            return;
        }

        const autoEnabled =
            document.getElementById("autoToggle").checked;

        if (autoEnabled) {
            return;
        }

        if (value === "FREE") {
            return;
        }

        const number =
            Number(value);

        const called =
            (latestState.called || []).map(Number);

        if (!called.includes(number)) {

            showGameMessage(
                "You can only touch a number after it is called.",
                "error"
            );

            return;
        }

        if (manuallyMarked.has(number)) {

            manuallyMarked.delete(number);

        } else {

            manuallyMarked.add(number);
        }

        renderPlayerBoard();
    }


    /* =========================================================
       AUTO MODE
    ========================================================= */

    async function changeAutoMode() {

        if (!latestState) {
            return;
        }

        const enabled =
            document.getElementById("autoToggle").checked;

        const result = await api("/api/auto", {
            method: "POST",
            body: JSON.stringify({
                enabled: enabled
            })
        });

        if (!result.ok || result.data.success === false) {

            document.getElementById("autoToggle").checked =
                !enabled;

            showGameMessage(
                result.data.message || "Could not change Auto mode.",
                "error"
            );

            return;
        }

        manuallyMarked.clear();

        updateManualHint();

        renderPlayerBoard();
    }


    function updateManualHint() {

        const autoEnabled =
            document.getElementById("autoToggle").checked;

        const hint =
            document.getElementById("manualHint");

        const bingoButton =
            document.getElementById("bingoButton");

        if (autoEnabled) {

            hint.textContent =
                "Auto is ON — numbers are marked automatically.";

            bingoButton.disabled = true;

        } else {

            hint.textContent =
                "Auto is OFF — touch called numbers, then press BINGO WIN.";

            bingoButton.disabled = false;
        }
    }


    /* =========================================================
       BINGO CLAIM
    ========================================================= */

    async function claimBingo() {

        if (!latestState) {
            return;
        }

        if (latestState.phase !== "playing") {
            return;
        }

        if (document.getElementById("autoToggle").checked) {

            showGameMessage(
                "Auto mode is ON.",
                "error"
            );

            return;
        }

        const button =
            document.getElementById("bingoButton");

        button.disabled = true;
        button.textContent = "CHECKING...";

        const result = await api("/api/claim", {
            method: "POST",
            body: JSON.stringify({})
        });

        if (result.data && result.data.disqualified) {

            showGameMessage(
                result.data.message ||
                "You are disqualified for this round.",
                "error"
            );

            button.textContent = "DISQUALIFIED";
            button.disabled = true;

            return;
        }

        if (!result.ok || result.data.success === false) {

            showGameMessage(
                result.data.message ||
                "BINGO is not valid.",
                "error"
            );

            button.disabled = false;
            button.textContent = "BINGO WIN";

            return;
        }

        showGameMessage(
            "BINGO WIN! You are the winner!",
            "success"
        );

        button.textContent = "WINNER!";
    }


    /* =========================================================
       POLLING
    ========================================================= */

    function startPolling() {

        if (pollTimer) {
            clearInterval(pollTimer);
        }

        pollState();

        pollTimer = setInterval(
            pollState,
            1000
        );
    }


    async function pollState() {

        const result =
            await api("/api/state");

        if (!result.ok) {
            return;
        }

        latestState =
            result.data;

        renderState();
    }


    /* =========================================================
       RENDER STATE
    ========================================================= */

    function renderState() {

        if (!latestState) {
            return;
        }

        updateStatusBar();

        const phase =
            latestState.phase;


        /* =========================
           SELECTION
        ========================== */

        if (
            phase === "selection" ||
            phase === "finished"
        ) {

            if (
                previousPhase !== "selection" &&
                previousPhase !== null
            ) {

                selectedCartela = null;
                manuallyMarked.clear();

                document
                    .querySelectorAll(".cartela-btn")
                    .forEach(btn =>
                        btn.classList.remove("selected")
                    );

                document.getElementById(
                    "proceedButton"
                ).disabled = true;
            }

            showScreen("selectionScreen");

            previousPhase = phase;

            return;
        }


        /* =========================
           GAME
        ========================== */

        if (
            phase === "starting" ||
            phase === "playing"
        ) {

            showScreen("gameScreen");

            renderGame();

            previousPhase = phase;

            return;
        }


        /* =========================
           RESULT
        ========================== */

        if (phase === "result") {

            showScreen("resultScreen");

            renderResult();

            previousPhase = phase;

            return;
        }
    }


    /* =========================================================
       STATUS BAR
    ========================================================= */

    function updateStatusBar() {

        const players =
            latestState.players ?? 0;

        const derash =
            latestState.derash ??
            latestState.prize ??
            0;

        const bet =
            latestState.bet ??
            10;

        const callCount =
            latestState.call_count ??
            (latestState.called
                ? latestState.called.length
                : 0);

        document.getElementById(
            "playersValue"
        ).textContent = players;

        document.getElementById(
            "derashValue"
        ).textContent = derash;

        document.getElementById(
            "betValue"
        ).textContent = bet;

        document.getElementById(
            "callValue"
        ).textContent = callCount;
    }


    /* =========================================================
       GAME RENDER
    ========================================================= */

    function renderGame() {

        updateCurrentCall();

        updateNumberBoard();

        /*
         * Use the server's auto setting when available.
         */

        if (typeof latestState.auto === "boolean") {

            document.getElementById(
                "autoToggle"
            ).checked = latestState.auto;
        }

        updateManualHint();

        if (latestState.disqualified) {

            document.getElementById(
                "bingoButton"
            ).disabled = true;

            document.getElementById(
                "bingoButton"
            ).textContent = "DISQUALIFIED";

            showGameMessage(
                latestState.message ||
                "You are disqualified for this round.",
                "error"
            );

        } else {

            renderPlayerBoard();
        }
    }


    /* =========================================================
       CURRENT CALL
    ========================================================= */

    function updateCurrentCall() {

        const called =
            latestState.called || [];

        const last =
            called.length
                ? called[called.length - 1]
                : null;

        document.getElementById(
            "currentCallBall"
        ).textContent =
            last ?? "—";

        document.getElementById(
            "currentCallNumber"
        ).textContent =
            last ?? "—";
    }


    /* =========================================================
       NUMBER BOARD MARKING
    ========================================================= */

    function updateNumberBoard() {

        const called =
            new Set(
                (latestState.called || [])
                    .map(Number)
            );

        const current =
            latestState.called &&
            latestState.called.length
                ? Number(
                    latestState.called[
                        latestState.called.length - 1
                    ]
                )
                : null;

        document
            .querySelectorAll(".number-cell")
            .forEach(cell => {

                const number =
                    Number(cell.dataset.number);

                cell.classList.remove(
                    "called",
                    "current"
                );

                if (called.has(number)) {
                    cell.classList.add("called");
                }

                if (current === number) {
                    cell.classList.add("current");
                }
            });
    }


    /* =========================================================
       PLAYER BOARD RENDER
    ========================================================= */

    function renderPlayerBoard() {

        if (!latestState.board) {
            return;
        }

        buildPlayerBoard(
            latestState.board,
            latestState.called || [],
            latestState.winner_cells || []
        );
    }


    /* =========================================================
       RESULT RENDER
    ========================================================= */

    function renderResult() {

        const name =
            latestState.winner_name ||
            latestState.winner ||
            "Winner";

        const pattern =
            latestState.winner_pattern ||
            "Winning pattern";

        const prize =
            latestState.prize ??
            latestState.derash ??
            0;

        document.getElementById(
            "winnerName"
        ).textContent =
            name;

        document.getElementById(
            "winnerPattern"
        ).textContent =
            "Winning pattern: " + pattern;

        document.getElementById(
            "winnerPrize"
        ).textContent =
            "Derash: " + prize;


        const board =
            document.getElementById(
                "resultBoard"
            );

        board.innerHTML = "";

        const winnerBoard =
            latestState.winner_board ||
            latestState.board;

        if (!winnerBoard) {
            return;
        }

        const winningSet =
            new Set(
                (latestState.winner_cells || [])
                    .map(
                        cell => Array.isArray(cell)
                            ? cell.join(",")
                            : String(cell)
                    )
            );


        for (let row = 0; row < 5; row++) {

            for (let col = 0; col < 5; col++) {

                const value =
                    winnerBoard[row][col];

                const cell =
                    document.createElement("div");

                cell.className =
                    "result-cell";

                cell.textContent =
                    value;

                if (value === "FREE") {
                    cell.classList.add("free");
                }

                const key =
                    row + "," + col;

                if (winningSet.has(key)) {
                    cell.classList.add(
                        "winner-cell"
                    );
                }

                board.appendChild(cell);
            }
        }
    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showGameMessage(message, type = "") {

        const element =
            document.getElementById(
                "gameMessage"
            );

        element.textContent =
            message;

        element.className =
            "game-message " + type;

        setTimeout(() => {

            if (
                element.textContent === message
            ) {
                element.textContent = "";
                element.className =
                    "game-message";
            }

        }, 5000);
    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    createCartelaButtons();

    buildNumberBoard();

    showScreen("selectionScreen");

    pollState();

</script>

</body>
